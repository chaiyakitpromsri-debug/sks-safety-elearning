<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKS Safety E-Learning V5 (Final Updated)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f9fafb; color: #111827; margin: 0; }
        .bg-sks-red { background-color: #dc2626; }
        .text-sks-red { color: #dc2626; }
        .border-sks-red { border-color: #dc2626; }
        .btn-red { background-color: #dc2626; color: white; transition: all 0.2s; border: none; cursor: pointer; }
        .btn-red:hover { background-color: #b91c1c; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .print-container { transform: scale(1); margin: 0; padding: 0; box-shadow: none; border: none; }
        }

        .cert-bg {
            background: white;
            border: 20px double #111827;
            position: relative;
        }
        .cert-bg::before {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 2px solid #dc2626;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { createRoot } = ReactDOM;

        // Improved Icon component
        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    iconRef.current.innerHTML = '';
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    if (className) iconElement.className = className;
                    iconElement.style.width = `${size}px`;
                    iconElement.style.height = `${size}px`;
                    iconElement.style.display = 'inline-block';
                    
                    iconRef.current.appendChild(iconElement);
                    window.lucide.createIcons({
                        node: iconRef.current
                    });
                }
            }, [name, size, className]);

            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

      const firebaseConfig = {
          apiKey: "AIzaSyCTVPEG8h9T1OU7fv5nQyKifSC-vAyr1Bo",
          authDomain: "driver-training-program.firebaseapp.com",
          projectId: "driver-training-program",
          storageBucket: "driver-training-program.firebasestorage.app",
          messagingSenderId: "231400779221",
          appId: "1:231400779221:web:877e508c2f3d2f053ca15c",
          measurementId: "G-KBMVK6JH0G"
};
 

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function App() {
            const [view, setView] = useState('loading'); 
            const [user, setUser] = useState(null); 
            const [courses, setCourses] = useState([]);
            const [allUsers, setAllUsers] = useState([]);
            const [activeCourse, setActiveCourse] = useState(null);
            const [quizQuestions, setQuizQuestions] = useState([]);
            const [currentQ, setCurrentQ] = useState(0);
            const [userAnswers, setUserAnswers] = useState({});
            
            // Filters state
            const [filters, setFilters] = useState({ name: '', company: '' });
            const [tempQ, setTempQ] = useState({ q: '', options: ['', '', '', ''], a: 0 });
            
            // File Input Ref for CSV Upload
            const fileInputRef = useRef(null);

            useEffect(() => {
                const unsub = db.collection('courses').onSnapshot(snap => {
                    setCourses(snap.docs.map(doc => ({id: doc.id, ...doc.data()})));
                }, error => {
                    console.error("Error fetching courses:", error);
                });
                checkSession();
                return () => unsub();
            }, []);

            useEffect(() => {
                if (view && view.startsWith('admin_')) {
                    const unsub = db.collection('users').onSnapshot(snap => {
                        setAllUsers(snap.docs.map(doc => ({id: doc.id, ...doc.data()})));
                    });
                    return () => unsub();
                }
            }, [view]);

            const checkSession = () => {
                const savedId = localStorage.getItem('sks_user_id');
                if (savedId) {
                    db.collection('users').doc(savedId).get().then(doc => {
                        if (doc.exists) {
                            const u = {id: doc.id, ...doc.data()};
                            setUser(u);
                            setView(u.role === 'admin' ? 'admin_dashboard' : 'dashboard');
                        } else {
                            localStorage.removeItem('sks_user_id');
                            setView('login');
                        }
                    }).catch(() => setView('login'));
                } else {
                    setView('login');
                }
            };

            const logout = () => { 
                localStorage.clear(); 
                setUser(null); 
                setView('login'); 
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                const n = e.target.fname.value.trim();
                const c = e.target.company.value.trim();
                const s = e.target.secret.value;
                if (!n || !c) return;

                const userId = n.toLowerCase().replace(/\s/g, '_');
                const isAdmin = s === 'sks_admin_master';
                const uRef = db.collection('users').doc(userId);
                
                try {
                    const doc = await uRef.get();
                    if (!doc.exists) {
                        await uRef.set({ name: n, company: c, role: isAdmin ? 'admin' : 'user', coursesStatus: {} });
                    }
                    localStorage.setItem('sks_user_id', userId);
                    checkSession();
                } catch (error) { alert("เข้าสู่ระบบผิดพลาด"); }
            };

            // CSV Export Function
            const exportToCSV = (data) => {
                const headers = ["Name", "Company", "Courses Status"];
                const rows = data.map(u => {
                    const statusStr = Object.entries(u.coursesStatus || {}).map(([cid, st]) => {
                        const courseName = courses.find(c => c.id === cid)?.titleTh || cid;
                        return `${courseName}: ${st.status} (${st.score}%)`;
                    }).join(" | ");
                    return `"${u.name}", "${u.company}", "${statusStr}"`;
                });
                
                const csvContent = "\uFEFF" + [headers.join(","), ...rows].join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", "SKS_Trainee_Report.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // CSV Import Function
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const text = evt.target.result;
                    const lines = text.split('\n');
                    let successCount = 0;
                    
                    const batch = db.batch();
                    let operationCount = 0;

                    lines.forEach((line) => {
                        const [rawName, rawCompany] = line.split(',').map(s => s?.trim()?.replace(/^"|"$/g, ''));
                        if (rawName && rawCompany && rawName !== "Name") { // Skip header if present
                            const uid = rawName.toLowerCase().replace(/\s/g, '_');
                            const ref = db.collection('users').doc(uid);
                            // Only set if not exists to avoid overwriting progress, or use merge
                            batch.set(ref, { 
                                name: rawName, 
                                company: rawCompany, 
                                role: 'user' 
                            }, { merge: true });
                            operationCount++;
                            successCount++;
                        }
                    });

                    if (operationCount > 0) {
                        await batch.commit();
                        alert(`Successfully imported ${successCount} users.`);
                    } else {
                        alert("No valid data found or file empty.");
                    }
                };
                reader.readAsText(file);
                // Reset input
                e.target.value = null;
            };


            if (view === 'loading') return <div className="h-screen flex items-center justify-center font-black text-slate-300 animate-pulse uppercase italic">SKS Loading...</div>;

            if (view === 'login') return (
                <div className="h-screen flex items-center justify-center bg-slate-50 p-6">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-200">
                        <div className="bg-black p-10 text-center border-b-8 border-sks-red">
                            <h1 className="text-white font-black text-3xl italic tracking-tighter uppercase">SKS E-Learning</h1>
                            <p className="text-sks-red text-[10px] font-bold tracking-[0.5em] mt-2">SAFETY MANAGEMENT SYSTEM</p>
                        </div>
                        <form onSubmit={handleLogin} className="p-10 space-y-6">
                            <input name="company" placeholder="ชื่อบริษัท / Company Name" required className="w-full p-4 bg-slate-50 border-b-2 border-slate-100 focus:border-sks-red outline-none font-bold text-slate-800 transition-all"/>
                            <input name="fname" placeholder="ชื่อ-นามสกุล / Full Name" required className="w-full p-4 bg-slate-50 border-b-2 border-slate-100 focus:border-sks-red outline-none font-bold text-slate-800 transition-all"/>
                            <input name="secret" type="password" placeholder="รหัสผ่าน Admin (ข้ามได้)" className="w-full text-center text-[10px] text-slate-300 outline-none hover:text-slate-900 mt-4 border-none bg-transparent"/>
                            <button type="submit" className="btn-red w-full py-5 rounded-2xl font-black uppercase text-sm tracking-widest shadow-xl shadow-red-100">Sign In</button>
                        </form>
                    </div>
                </div>
            );

            // USER VIEWS
            if (view === 'dashboard') return (
                <div className="min-h-screen bg-slate-50">
                    <header className="bg-black text-white p-6 px-12 flex justify-between items-center sticky top-0 z-50 border-b-4 border-sks-red">
                        <div className="flex items-center gap-4">
                            <div className="w-10 h-10 bg-sks-red rounded flex items-center justify-center font-black italic">S</div>
                            <h1 className="font-black text-xl italic tracking-tighter uppercase">SKS Safety Portal</h1>
                        </div>
                        <div className="flex items-center gap-6">
                            <div className="text-right hidden sm:block">
                                <p className="text-xs font-black uppercase">{user?.name}</p>
                                <p className="text-[10px] text-sks-red font-bold uppercase tracking-widest">{user?.company}</p>
                            </div>
                            <button onClick={logout} className="p-3 bg-white/10 hover:bg-sks-red rounded-xl transition-all flex items-center gap-2 border-none cursor-pointer text-white">
                                <Icon name="log-out" size={18}/>
                            </button>
                        </div>
                    </header>
                    <main className="max-w-7xl mx-auto p-6 md:p-12">
                        <div className="mb-12 border-l-8 border-sks-red pl-8">
                            <h2 className="text-3xl md:text-5xl font-black italic uppercase tracking-tighter">My Courses</h2>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                            {courses.map(course => {
                                const s = user?.coursesStatus?.[course.id];
                                const isPassed = s?.status === 'Passed';
                                return (
                                    <div key={course.id} className="bg-white rounded-[40px] shadow-sm border border-slate-100 overflow-hidden flex flex-col group hover:shadow-2xl transition-all">
                                        <div className="p-10 flex-1">
                                            <div className="flex justify-between items-start mb-8">
                                                <div className="p-4 bg-slate-50 rounded-2xl group-hover:bg-sks-red group-hover:text-white transition-all">
                                                    <Icon name={isPassed ? "award" : "book-open"} size={32}/>
                                                </div>
                                                {isPassed && <span className="bg-green-100 text-green-600 text-[10px] font-black px-4 py-1 rounded-full uppercase tracking-widest">Completed</span>}
                                            </div>
                                            <h3 className="font-black text-2xl uppercase italic tracking-tighter">{course.titleTh}</h3>
                                        </div>
                                        <div className="p-8 bg-slate-50 flex flex-col gap-4">
                                            <button onClick={() => { setActiveCourse(course); setView('course'); }} className={`w-full py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition-all ${isPassed?'bg-black text-white hover:bg-sks-red':'btn-red shadow-lg'}`}>
                                                {isPassed ? 'Review' : 'Start'}
                                            </button>
                                            {isPassed && (
                                                <button onClick={() => { setActiveCourse(course); setView('certificate'); }} className="w-full py-4 rounded-2xl border-2 border-black font-black text-xs uppercase tracking-widest hover:bg-black hover:text-white transition-all flex items-center justify-center gap-2 bg-transparent cursor-pointer">
                                                    <Icon name="printer" size={14}/> Certificate
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>
                </div>
            );
            
            if (view === 'course') return (
                <div className="min-h-screen bg-white">
                    <header className="p-8 border-b-2 border-slate-100 flex justify-between items-center px-12">
                        <button onClick={() => setView('dashboard')} className="flex items-center gap-3 text-slate-400 font-black uppercase text-xs hover:text-black transition-all bg-transparent border-none cursor-pointer"><Icon name="chevron-left" size={18}/> Back</button>
                        <h2 className="font-black italic text-xl uppercase tracking-tighter">{activeCourse?.titleTh}</h2>
                        <div className="w-12"></div>
                    </header>
                    <main className="max-w-5xl mx-auto p-6 md:p-12">
                        <div className="aspect-video bg-black rounded-[30px] overflow-hidden shadow-2xl border-8 border-slate-900 mb-12">
                            {activeCourse?.videoId ? (
                                <iframe className="w-full h-full" src={`https://www.youtube.com/embed/${activeCourse.videoId}`} frameBorder="0" allowFullScreen></iframe>
                            ) : <div className="w-full h-full flex items-center justify-center text-white opacity-20">Video Not Available</div>}
                        </div>
                        <div className="text-center">
                            <button onClick={() => {
                                if(!activeCourse?.questions?.length) return alert("ไม่มีข้อสอบ");
                                setQuizQuestions([...activeCourse.questions].sort(() => Math.random() - 0.5));
                                setCurrentQ(0); setUserAnswers({}); setView('quiz');
                            }} className="btn-red px-16 py-6 rounded-[30px] font-black text-xl uppercase tracking-[0.4em] shadow-2xl">Start Exam</button>
                        </div>
                    </main>
                </div>
            );

            if (view === 'quiz') {
                const q = quizQuestions[currentQ];
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6">
                        <div className="bg-white p-8 md:p-16 w-full max-w-4xl rounded-[40px] shadow-2xl border-b-[20px] border-sks-red relative">
                            <div className="flex justify-between items-center mb-12">
                                <span className="font-black italic text-sks-red text-2xl uppercase italic">Safety Exam</span>
                                <span className="font-black text-slate-400 uppercase text-xs tracking-widest">{currentQ + 1} / {quizQuestions.length}</span>
                            </div>
                            <h3 className="text-2xl font-black text-slate-900 mb-12 uppercase italic">{q?.q}</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {q?.options.map((opt, i) => (
                                    <button key={i} onClick={() => setUserAnswers({...userAnswers, [currentQ]: i})} className={`w-full p-8 text-left rounded-[35px] border-4 transition-all font-black text-lg cursor-pointer ${userAnswers[currentQ] === i ? 'bg-black text-white border-black' : 'border-slate-100 hover:border-sks-red text-slate-400 bg-slate-50'}`}>
                                        <span className="text-sks-red mr-2">{i+1}.</span> {opt}
                                    </button>
                                ))}
                            </div>
                            <div className="flex justify-between items-center mt-16">
                                <button disabled={currentQ === 0} onClick={() => setCurrentQ(currentQ - 1)} className="text-slate-400 font-black uppercase text-xs disabled:opacity-0 bg-transparent border-none cursor-pointer">Previous</button>
                                {currentQ < quizQuestions.length - 1 ? (
                                    <button disabled={userAnswers[currentQ] === undefined} onClick={() => setCurrentQ(currentQ + 1)} className="bg-black text-white px-10 py-4 rounded-2xl font-black uppercase text-xs disabled:opacity-20 cursor-pointer border-none">Next</button>
                                ) : (
                                    <button disabled={userAnswers[currentQ] === undefined} onClick={async () => {
                                        let correct = 0;
                                        quizQuestions.forEach((q, i) => { if(userAnswers[i] === q.a) correct++; });
                                        const score = Math.round((correct / quizQuestions.length) * 100);
                                        const pass = score >= (activeCourse?.passScore || 80);
                                        const res = { status: pass?'Passed':'Failed', score, date: new Date().toLocaleDateString('th-TH') };
                                        const newStatus = { ...user.coursesStatus, [activeCourse.id]: res };
                                        await db.collection('users').doc(user.id).update({ coursesStatus: newStatus });
                                        setUser({...user, coursesStatus: newStatus}); setView('result');
                                    }} className="btn-red px-16 py-4 rounded-2xl font-black uppercase text-xs">Submit</button>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'result') {
                const res = user?.coursesStatus[activeCourse?.id];
                const passed = res?.status === 'Passed';
                return (
                    <div className="min-h-screen bg-slate-100 flex items-center justify-center p-6 text-center">
                        <div className="bg-white p-20 w-full max-w-xl rounded-[60px] shadow-2xl border-t-[30px] border-black">
                            <Icon name={passed?'award':'frown'} size={80} className={passed?'text-green-500 mx-auto mb-10':'text-red-500 mx-auto mb-10'}/>
                            <h2 className={`text-5xl font-black mb-4 italic uppercase ${passed?'text-green-600':'text-red-600'}`}>{passed?'PASS':'FAILED'}</h2>
                            <div className="text-8xl font-black text-slate-900 mb-12">{res?.score}<span className="text-2xl text-sks-red">%</span></div>
                            <button onClick={() => setView('dashboard')} className="w-full bg-black text-white py-4 rounded-2xl text-xs font-black uppercase tracking-widest border-none cursor-pointer">Back to Home</button>
                        </div>
                    </div>
                );
            }

            if (view === 'certificate') return (
                <div className="min-h-screen bg-slate-200 flex flex-col items-center p-12 no-print overflow-y-auto">
                    <div className="bg-white p-12 w-full max-w-[1000px] aspect-[100/70] cert-bg shadow-2xl flex flex-col items-center justify-center text-center print-container">
                        <h1 className="text-6xl font-black italic uppercase tracking-tighter text-slate-900 mb-2">Certificate</h1>
                        <p className="text-sks-red font-bold uppercase tracking-[0.5em] mb-16 text-[10px]">of course completion</p>
                        <h2 className="text-5xl font-black text-slate-900 mb-6 border-b-4 border-slate-100 px-12 pb-4">{user?.name}</h2>
                        <p className="text-lg text-slate-600 mb-16 max-w-2xl font-bold">Has successfully completed the safety training program in<br/><span className="text-black italic uppercase tracking-tight text-2xl">"{activeCourse?.titleTh}"</span><br/>at <span className="text-black">{user?.company}</span></p>
                        <div className="flex justify-between w-full px-24 items-end">
                            <div className="text-center">
                                <p className="font-black border-b-2 border-slate-900 pb-1 px-6">{user?.coursesStatus[activeCourse?.id]?.date}</p>
                                <p className="text-[9px] font-bold text-slate-400 uppercase mt-2">Date Issued</p>
                            </div>
                            <div className="w-24 h-24 bg-black rounded-full flex items-center justify-center text-white font-black italic border-4 border-sks-red">SKS</div>
                            <div className="text-center">
                                <div className="h-10 w-32 mx-auto border-b-2 border-slate-900 mb-1"></div>
                                <p className="text-[9px] font-bold text-slate-400 uppercase">Authorized Signature</p>
                            </div>
                        </div>
                    </div>
                    <div className="mt-12 flex gap-4 no-print">
                        <button onClick={() => window.print()} className="bg-black text-white px-12 py-4 rounded-2xl font-black text-xs uppercase tracking-widest flex items-center gap-3 shadow-xl border-none cursor-pointer"><Icon name="printer" size={18}/> Print PDF</button>
                        <button onClick={() => setView('dashboard')} className="bg-white text-slate-400 px-12 py-4 rounded-2xl font-black text-xs uppercase tracking-widest border-none cursor-pointer">Close</button>
                    </div>
                </div>
            );

            // --- ADMIN WRAPPER ---
            const AdminNav = () => (
                <nav className="w-72 bg-black text-white p-8 flex flex-col border-r-8 border-sks-red no-print min-h-screen">
                    <div className="flex items-center gap-3 mb-12">
                        <div className="w-10 h-10 bg-sks-red rounded flex items-center justify-center font-black italic">S</div>
                        <h2 className="font-black text-xl italic tracking-tighter uppercase">SKS ADMIN</h2>
                    </div>
                    <div className="space-y-4 flex-1">
                        <button onClick={() => setView('admin_dashboard')} className={`w-full flex items-center gap-4 p-4 rounded-xl font-bold text-xs uppercase tracking-widest border-none cursor-pointer text-left ${view==='admin_dashboard'?'bg-sks-red text-white':'text-slate-500 hover:text-white bg-transparent'}`}><Icon name="layout-grid" size={18}/> Dashboard</button>
                        <button onClick={() => setView('admin_report')} className={`w-full flex items-center gap-4 p-4 rounded-xl font-bold text-xs uppercase tracking-widest border-none cursor-pointer text-left ${view==='admin_report'?'bg-sks-red text-white':'text-slate-500 hover:text-white bg-transparent'}`}><Icon name="users" size={18}/> Trainees</button>
                        <button onClick={() => setView('admin_courses')} className={`w-full flex items-center gap-4 p-4 rounded-xl font-bold text-xs uppercase tracking-widest border-none cursor-pointer text-left ${view==='admin_courses'?'bg-sks-red text-white':'text-slate-500 hover:text-white bg-transparent'}`}><Icon name="book-open" size={18}/> Courses</button>
                    </div>
                    <button onClick={logout} className="p-4 font-black text-xs text-sks-red flex items-center gap-4 hover:bg-slate-900 rounded-xl transition-all border-none bg-transparent cursor-pointer"><Icon name="log-out" size={18}/> Logout</button>
                </nav>
            );

            if (view === 'admin_dashboard') return (
                <div className="flex min-h-screen">
                    <AdminNav />
                    <main className="flex-1 p-12 overflow-y-auto">
                        <div className="mb-12 border-b-4 border-black pb-4">
                            <h2 className="text-4xl font-black italic uppercase">System Overview</h2>
                        </div>
                        <div className="grid grid-cols-3 gap-8 mb-12">
                            <div className="bg-white p-10 rounded-3xl border-b-8 border-black shadow-sm">
                                <p className="text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest">Total Trainees</p>
                                <h3 className="text-6xl font-black text-slate-900">{allUsers.filter(u=>u.role!=='admin').length}</h3>
                            </div>
                            <div className="bg-white p-10 rounded-3xl border-b-8 border-sks-red shadow-sm">
                                <p className="text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest">Completed</p>
                                <h3 className="text-6xl font-black text-sks-red">{allUsers.filter(u => Object.values(u.coursesStatus || {}).some(s => s.status === 'Passed')).length}</h3>
                            </div>
                            <div className="bg-white p-10 rounded-3xl border-b-8 border-black shadow-sm">
                                <p className="text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest">Active Courses</p>
                                <h3 className="text-6xl font-black text-slate-900">{courses.length}</h3>
                            </div>
                        </div>
                    </main>
                </div>
            );

            if (view === 'admin_report') {
                const filteredUsers = allUsers.filter(u => {
                    if (u.role === 'admin') return false;
                    const matchesName = u.name?.toLowerCase().includes(filters.name.toLowerCase());
                    const matchesCompany = u.company?.toLowerCase().includes(filters.company.toLowerCase());
                    return matchesName && matchesCompany;
                });

                return (
                    <div className="flex min-h-screen">
                        <AdminNav />
                        <main className="flex-1 p-12">
                            <div className="flex justify-between items-end border-b-4 border-black pb-4 mb-10">
                                <h2 className="text-4xl font-black italic uppercase">Trainee Report</h2>
                                <div className="flex gap-4">
                                    {/* HIDDEN FILE INPUT */}
                                    <input 
                                        type="file" 
                                        ref={fileInputRef} 
                                        onChange={handleFileUpload} 
                                        accept=".csv,.txt"
                                        style={{display:'none'}} 
                                    />
                                    <button 
                                        onClick={() => fileInputRef.current.click()} 
                                        className="bg-black text-white px-6 py-3 rounded-xl font-black text-[10px] uppercase cursor-pointer border-none shadow-lg hover:bg-slate-800 transition-all flex items-center gap-2"
                                    >
                                        <Icon name="upload" size={14}/> Import CSV
                                    </button>
                                    <button 
                                        onClick={() => exportToCSV(filteredUsers)} 
                                        className="bg-black text-white px-6 py-3 rounded-xl font-black text-[10px] uppercase cursor-pointer border-none shadow-lg hover:bg-slate-800 transition-all flex items-center gap-2"
                                    >
                                        <Icon name="download" size={14}/> Export Report
                                    </button>
                                    <button 
                                        onClick={async () => { if(confirm("ลบข้อมูลทั้งหมด?")) { const b = db.batch(); allUsers.filter(u=>u.role!=='admin').forEach(u=>b.delete(db.collection('users').doc(u.id))); await b.commit(); } }} 
                                        className="bg-sks-red text-white px-6 py-3 rounded-xl font-black text-[10px] uppercase cursor-pointer border-none shadow-lg flex items-center gap-2"
                                    >
                                        <Icon name="trash-2" size={14}/> Clear Data
                                    </button>
                                </div>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                                <div className="relative">
                                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="search" size={16}/></span>
                                    <input 
                                        placeholder="FILTER BY NAME / ค้นหาตามชื่อ" 
                                        className="w-full pl-12 pr-4 py-4 bg-white border-2 border-slate-100 rounded-2xl font-black text-[10px] uppercase tracking-widest outline-none focus:border-sks-red transition-all"
                                        value={filters.name}
                                        onChange={(e) => setFilters({...filters, name: e.target.value})}
                                    />
                                </div>
                                <div className="relative">
                                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="building" size={16}/></span>
                                    <input 
                                        placeholder="FILTER BY COMPANY / ค้นหาตามบริษัท" 
                                        className="w-full pl-12 pr-4 py-4 bg-white border-2 border-slate-100 rounded-2xl font-black text-[10px] uppercase tracking-widest outline-none focus:border-sks-red transition-all"
                                        value={filters.company}
                                        onChange={(e) => setFilters({...filters, company: e.target.value})}
                                    />
                                </div>
                            </div>

                            <div className="bg-white border-2 border-slate-100 rounded-3xl overflow-hidden shadow-sm">
                                <table className="w-full text-left text-xs font-bold">
                                    <thead>
                                        <tr className="bg-slate-50 text-slate-400 uppercase tracking-widest">
                                            <th className="p-6">Name</th><th className="p-6">Company</th><th className="p-6">Course Status</th><th className="p-6"></th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-50">
                                        {filteredUsers.length > 0 ? filteredUsers.map(u => (
                                            <tr key={u.id} className="hover:bg-slate-50 transition-colors">
                                                <td className="p-6 text-slate-900 uppercase italic font-black">{u.name}</td>
                                                <td className="p-6 text-slate-400 font-bold uppercase">{u.company}</td>
                                                <td className="p-6">
                                                    {Object.entries(u.coursesStatus || {}).map(([cid, res]) => (
                                                        <div key={cid} className={`text-[9px] mb-1 font-black ${res.status==='Passed'?'text-green-500':'text-red-500'}`}>
                                                            <span className="opacity-60">{(courses.find(c=>c.id===cid))?.titleTh || cid}:</span> {res.score}% {res.status === 'Passed' ? '✓' : '✗'}
                                                        </div>
                                                    ))}
                                                    {Object.keys(u.coursesStatus || {}).length === 0 && <span className="text-[9px] text-slate-300 font-bold italic uppercase">No Activity</span>}
                                                </td>
                                                <td className="p-6 text-right">
                                                    <button onClick={async () => { if(confirm("ลบ?")) await db.collection('users').doc(u.id).delete(); }} className="text-slate-200 hover:text-sks-red transition-all border-none bg-transparent cursor-pointer"><Icon name="trash-2" size={16}/></button>
                                                </td>
                                            </tr>
                                        )) : (
                                            <tr>
                                                <td colSpan="4" className="p-20 text-center text-slate-300 font-black italic uppercase tracking-[0.2em]">No Trainees Found</td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </main>
                    </div>
                );
            }

            if (view === 'admin_courses') return (
                <div className="flex min-h-screen">
                    <AdminNav />
                    <main className="flex-1 p-12">
                        <div className="flex justify-between items-center mb-12 border-b-4 border-black pb-4">
                            <h2 className="text-4xl font-black italic uppercase">Courses</h2>
                            <button onClick={() => { setActiveCourse({titleTh:'', titleEn:'', videoId:'', passScore:80, questions:[]}); setView('admin_add_course'); }} className="btn-red px-10 py-4 rounded-2xl font-black text-xs uppercase cursor-pointer">NEW COURSE</button>
                        </div>
                        <div className="grid grid-cols-2 gap-8">
                            {courses.map(c => (
                                <div key={c.id} className="bg-white p-8 rounded-3xl border-l-[12px] border-black shadow-sm flex justify-between items-center">
                                    <div>
                                        <h3 className="text-2xl font-black uppercase italic">{c.titleTh}</h3>
                                        <p className="text-slate-400 font-bold text-[10px] uppercase">Q: {c.questions?.length || 0} | Pass: {c.passScore}%</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => { setActiveCourse(c); setView('admin_add_course'); }} className="w-12 h-12 bg-black text-white rounded-2xl flex items-center justify-center cursor-pointer border-none"><Icon name="edit-3" size={20}/></button>
                                        
                                        {/* FIXED DELETE BUTTON */}
                                        <button onClick={async (e) => { 
                                            e.preventDefault();
                                            e.stopPropagation(); // Stop event bubbling
                                            if(confirm("คุณต้องการลบหลักสูตรนี้ใช่หรือไม่? (ไม่สามารถกู้คืนได้)")) {
                                                try {
                                                    await db.collection('courses').doc(c.id).delete();
                                                } catch (err) {
                                                    alert("Error deleting course: " + err.message);
                                                }
                                            }
                                        }} className="w-12 h-12 bg-slate-50 text-slate-200 rounded-2xl flex items-center justify-center cursor-pointer border-none hover:bg-sks-red hover:text-white transition-colors">
                                            <Icon name="trash" size={20}/>
                                        </button>

                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );

            if (view === 'admin_add_course') return (
                <div className="min-h-screen bg-slate-50 flex justify-center p-12">
                    <div className="bg-white w-full max-w-5xl rounded-[40px] shadow-2xl overflow-hidden flex flex-col">
                        <header className="bg-black p-8 text-white flex justify-between items-center">
                            <h2 className="text-2xl font-black italic uppercase">Manage Course</h2>
                            <button onClick={() => setView('admin_courses')} className="bg-white/10 px-6 py-2 rounded-xl text-[10px] font-bold border-none cursor-pointer text-white">Cancel</button>
                        </header>
                        <form onSubmit={async (e) => {
                            e.preventDefault();
                            const fd = new FormData(e.target);
                            const data = { titleTh: fd.get('titleTh'), titleEn: fd.get('titleEn'), videoId: fd.get('videoId'), passScore: parseInt(fd.get('passScore')) || 80, questions: activeCourse.questions || [] };
                            if(activeCourse.id) await db.collection('courses').doc(activeCourse.id).update(data);
                            else await db.collection('courses').add(data);
                            setView('admin_courses');
                        }} className="p-12 space-y-10 overflow-y-auto">
                            <div className="grid grid-cols-2 gap-10">
                                <input name="titleTh" defaultValue={activeCourse.titleTh} required className="p-4 bg-slate-50 border-b-2 border-slate-100 outline-none font-bold" placeholder="ชื่อภาษาไทย"/>
                                <input name="titleEn" defaultValue={activeCourse.titleEn} required className="p-4 bg-slate-50 border-b-2 border-slate-100 outline-none font-bold" placeholder="English Title"/>
                                <input name="videoId" defaultValue={activeCourse.videoId} className="p-4 bg-slate-50 border-b-2 border-slate-100 outline-none font-bold" placeholder="YouTube ID"/>
                                <input name="passScore" type="number" defaultValue={activeCourse.passScore} className="p-4 bg-slate-50 border-b-2 border-slate-100 outline-none font-bold" placeholder="Pass %"/>
                            </div>
                            
                            <div className="p-10 bg-slate-900 rounded-[40px] text-white">
                                <h4 className="font-black text-sks-red text-xs uppercase mb-8">Quiz Builder</h4>
                                <div className="bg-black/50 p-6 rounded-3xl space-y-4 mb-10">
                                    <input placeholder="Question Text..." className="w-full p-4 bg-slate-800 text-white rounded-xl outline-none" value={tempQ.q} onChange={e=>setTempQ({...tempQ, q:e.target.value})}/>
                                    <div className="grid grid-cols-2 gap-4">
                                        {tempQ.options.map((o, idx) => (
                                            <div key={idx} className="flex items-center gap-3 bg-slate-800 p-2 rounded-xl">
                                                <input type="radio" checked={tempQ.a === idx} onChange={()=>setTempQ({...tempQ, a:idx})} className="accent-sks-red"/>
                                                <input placeholder={`Opt ${idx+1}`} className="bg-transparent text-xs w-full outline-none text-white" value={o} onChange={e=>{
                                                    const newOpts = [...tempQ.options]; newOpts[idx] = e.target.value; setTempQ({...tempQ, options: newOpts});
                                                }}/>
                                            </div>
                                        ))}
                                    </div>
                                    <button type="button" onClick={() => {
                                        if(!tempQ.q || tempQ.options.some(o=>!o)) return alert("ครบไหม?");
                                        setActiveCourse({...activeCourse, questions: [...(activeCourse.questions||[]), tempQ]});
                                        setTempQ({ q: '', options: ['', '', '', ''], a: 0 });
                                    }} className="w-full py-4 bg-white text-black rounded-2xl font-black text-xs uppercase cursor-pointer border-none">Add Question</button>
                                </div>
                                <div className="space-y-4 max-h-60 overflow-y-auto">
                                    {activeCourse.questions?.map((q, i) => (
                                        <div key={i} className="bg-white/5 p-4 rounded-2xl flex justify-between items-center">
                                            <p className="text-sm font-bold uppercase italic">{i+1}. {q.q}</p>
                                            <button type="button" onClick={()=>{
                                                const qs = [...activeCourse.questions]; qs.splice(i,1); setActiveCourse({...activeCourse, questions: qs});
                                            }} className="text-slate-500 hover:text-sks-red border-none bg-transparent cursor-pointer"><Icon name="trash-2" size={16}/></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <button type="submit" className="btn-red w-full py-6 rounded-3xl font-black text-xl uppercase tracking-[0.3em]">Save Course</button>
                        </form>
                    </div>
                </div>
            );

            return null;
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
