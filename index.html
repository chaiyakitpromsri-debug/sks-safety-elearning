<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKS Safety Enterprise LMS</title>
    
    <!-- 1. Tailwind CSS สำหรับการตกแต่ง UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. React & ReactDOM (Core Libraries) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Babel สำหรับแปลง JSX ให้ Browser เข้าใจ -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 4. Lucide Icons (ใช้แทนการ import package) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- 5. Firebase SDKs (เวอร์ชันที่รองรับการใช้งานในไฟล์เดี่ยว) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        // --- ดึงค่า Config จาก Environment ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sks-safety-enterprise-v4';
        
        // Initializing Firebase (Compatibility Mode)
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const OWNER_EMAIL = 'owner@sks.com';

        // สร้าง Lucide Icon Component เพื่อให้ใช้ใน React ได้ง่ายๆ
        const Icon = ({ name, size = 20, className = "" }) => {
            const [svg, setSvg] = React.useState("");
            React.useEffect(() => {
                const icon = lucide.createIcons.icons[name];
                if (icon) {
                    setSvg(lucide.createIcons.icons[name]);
                }
            }, [name]);
            // ใช้ SVG แทนการเรียก Component ตรงๆ เนื่องจากข้อจำกัดของ CDN
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const { useState, useEffect } = React;

        function App() {
            const [view, setView] = useState('login');
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [loading, setLoading] = useState(true);
            const [courses, setCourses] = useState([]);
            const [allUsers, setAllUsers] = useState([]);
            const [activeCourse, setActiveCourse] = useState(null);
            const [currentQ, setCurrentQ] = useState(0);
            const [userAnswers, setUserAnswers] = useState({});

            // 1. Authentication Listener
            useEffect(() => {
                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await auth.signInWithCustomToken(__initial_auth_token);
                    } else {
                        await auth.signInAnonymously();
                    }
                };
                initAuth();

                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    if (!u) {
                        setView('login');
                        setProfile(null);
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // 2. Data Fetching (Real-time)
            useEffect(() => {
                if (!user || !profile) return;

                const coursesRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('courses');
                const unsubCourses = coursesRef.onSnapshot(snap => {
                    setCourses(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                let unsubUsers = () => {};
                if (profile.role === 'owner' || profile.role === 'admin') {
                    const usersRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users');
                    unsubUsers = usersRef.onSnapshot(snap => {
                        setAllUsers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                }
                
                // หลังจากข้อมูลโหลดเสร็จ ให้สั่ง Lucide scan icon ใหม่
                setTimeout(() => lucide.createIcons(), 500);

                return () => { unsubCourses(); unsubUsers(); };
            }, [user, profile]);

            // Run Lucide Scan ทุกครั้งที่ View เปลี่ยน
            useEffect(() => {
                lucide.createIcons();
            }, [view]);

            const handleLogin = async (e) => {
                e.preventDefault();
                const email = e.target.email.value.trim().toLowerCase();
                const emailKey = email.replace(/[@.]/g, '_');

                const userDocRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users').doc(emailKey);

                if (email === OWNER_EMAIL) {
                    const ownerProfile = { email, name: 'System Owner', role: 'owner', uid: user.uid };
                    await userDocRef.set(ownerProfile, { merge: true });
                    setProfile(ownerProfile);
                    setView('dashboard');
                    return;
                }

                const doc = await userDocRef.get();
                if (doc.exists) {
                    setProfile(doc.data());
                    setView('dashboard');
                } else {
                    setView('register');
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                const email = e.target.email.value.trim().toLowerCase();
                const emailKey = email.replace(/[@.]/g, '_');
                const newProfile = {
                    email,
                    name: e.target.name.value,
                    company: e.target.company.value,
                    role: 'trainee',
                    progress: 0,
                    coursesStatus: {},
                    uid: user.uid
                };
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users').doc(emailKey).set(newProfile);
                setProfile(newProfile);
                setView('dashboard');
            };

            const submitQuiz = async () => {
                let score = 0;
                activeCourse.questions.forEach((q, i) => { if (userAnswers[i] === q.a) score++; });
                const percent = Math.round((score / activeCourse.questions.length) * 100);
                const passed = percent >= activeCourse.passScore;

                const emailKey = profile.email.replace(/[@.]/g, '_');
                const updatedStatus = { ...profile.coursesStatus, [activeCourse.id]: { status: passed ? 'Passed' : 'Failed', score: percent, date: new Date().toLocaleDateString() } };
                
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users').doc(emailKey).update({
                    coursesStatus: updatedStatus,
                    progress: Math.min(100, (profile.progress || 0) + 20)
                });

                setProfile(prev => ({ ...prev, coursesStatus: updatedStatus }));
                setView('result');
            };

            const exportCSV = () => {
                let csv = "Name,Email,Company,Role,Progress\n";
                allUsers.forEach(u => {
                    csv += `"${u.name}","${u.email}","${u.company || 'N/A'}","${u.role}",${u.progress || 0}%\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `SKS_Report_${Date.now()}.csv`;
                a.click();
            };

            if (loading) return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center text-white italic animate-pulse">
                    Initializing SKS Safe System...
                </div>
            );

            // --- UI Renders ---
            
            if (view === 'login') return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 p-6">
                    <div className="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md text-center">
                        <div className="bg-red-100 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="shield" className="w-10 h-10 text-red-600"></i>
                        </div>
                        <h1 className="text-3xl font-black italic uppercase text-slate-800">SKS Safety</h1>
                        <p className="text-slate-400 text-xs uppercase tracking-[0.2em] mb-8">Enterprise Learning Management</p>
                        <form onSubmit={handleLogin} className="space-y-4 text-left">
                            <div>
                                <label className="text-[10px] font-black uppercase text-slate-400 ml-1">Work Email</label>
                                <input name="email" type="email" required className="w-full p-4 border-2 border-slate-100 rounded-2xl outline-none focus:border-red-600 transition text-slate-800" placeholder="yourname@sks.com" />
                            </div>
                            <button className="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-red-600 transition shadow-xl">เข้าสู่ระบบ</button>
                        </form>
                    </div>
                </div>
            );

            if (view === 'register') return (
                <div className="min-h-screen flex items-center justify-center bg-slate-900 p-6">
                    <div className="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md">
                        <h2 className="text-2xl font-bold mb-2">ลงทะเบียนพนักงานใหม่</h2>
                        <form onSubmit={handleRegister} className="space-y-4">
                            <input name="email" type="email" readOnly value={document.querySelector('input[name="email"]')?.value} className="w-full p-4 bg-slate-50 border rounded-2xl text-slate-400" />
                            <input name="name" required className="w-full p-4 border-2 border-slate-100 rounded-2xl outline-none focus:border-red-600" placeholder="ชื่อ-นามสกุล" />
                            <input name="company" required className="w-full p-4 border-2 border-slate-100 rounded-2xl outline-none focus:border-red-600" placeholder="บริษัทขนส่ง / แผนก" />
                            <button className="w-full bg-red-600 text-white py-4 rounded-2xl font-bold shadow-xl">บันทึกข้อมูลและเริ่มต้น</button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="flex min-h-screen bg-slate-50">
                    <aside className="w-72 bg-slate-900 text-white p-8 hidden lg:flex flex-col h-screen sticky top-0">
                        <div className="flex items-center gap-3 mb-10">
                            <div className="bg-red-600 p-2 rounded-lg text-white"><i data-lucide="shield"></i></div>
                            <span className="font-bold text-xl italic uppercase tracking-tighter">SKS Portal</span>
                        </div>
                        <nav className="space-y-2 flex-1">
                            <button onClick={() => setView('dashboard')} className={`w-full flex items-center gap-3 p-4 rounded-2xl transition font-bold text-sm ${view === 'dashboard' ? 'bg-slate-800 text-white' : 'text-slate-500 hover:text-white'}`}>
                                <i data-lucide="layout" className="w-4 h-4"></i> Dashboard
                            </button>
                            {(profile?.role === 'owner' || profile?.role === 'admin') && (
                                <button onClick={() => setView('user-mgmt')} className={`w-full flex items-center gap-3 p-4 rounded-2xl transition font-bold text-sm ${view === 'user-mgmt' ? 'bg-slate-800 text-white' : 'text-slate-500 hover:text-white'}`}>
                                    <i data-lucide="bar-chart-3" className="w-4 h-4"></i> Analytics
                                </button>
                            )}
                        </nav>
                        <div className="pt-6 border-t border-slate-800">
                            <p className="font-bold text-sm truncate">{profile?.name}</p>
                            <button onClick={() => auth.signOut()} className="flex items-center gap-2 text-slate-500 hover:text-white text-sm font-bold mt-2">
                                <i data-lucide="log-out" className="w-4 h-4"></i> Logout
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 p-8 md:p-12">
                        {view === 'dashboard' && (
                            <div className="max-w-6xl mx-auto">
                                <header className="mb-10">
                                    <h2 className="text-3xl font-black italic uppercase">Learning Dashboard</h2>
                                    <p className="text-slate-400">Welcome back, {profile?.name}</p>
                                </header>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    {courses.map(c => (
                                        <div key={c.id} className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 group hover:shadow-xl transition-all">
                                            <div className="flex justify-between items-start mb-6">
                                                <div className="bg-slate-100 p-4 rounded-2xl group-hover:bg-red-600 group-hover:text-white transition-colors">
                                                    <i data-lucide="play-circle"></i>
                                                </div>
                                            </div>
                                            <h3 className="text-xl font-bold mb-2">{c.title}</h3>
                                            <p className="text-slate-500 text-sm mb-8 line-clamp-2">{c.desc}</p>
                                            <button onClick={() => { setActiveCourse(c); setView('course'); }} className="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-red-600 transition shadow-lg flex items-center justify-center gap-2">
                                                เริ่มบทเรียน <i data-lucide="chevron-right" className="w-4 h-4"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'user-mgmt' && (
                            <div>
                                <div className="flex justify-between items-center mb-10">
                                    <h2 className="text-3xl font-black italic uppercase">User Reports</h2>
                                    <button onClick={exportCSV} className="bg-green-600 text-white px-6 py-3 rounded-2xl font-bold flex items-center gap-2 shadow-lg">
                                        <i data-lucide="download" className="w-4 h-4"></i> Export CSV
                                    </button>
                                </div>
                                <div className="bg-white rounded-[2.5rem] shadow-sm border border-slate-200 overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 border-b text-[10px] font-black uppercase text-slate-400">
                                            <tr>
                                                <th className="p-6">User</th>
                                                <th className="p-6 text-center">Progress</th>
                                                <th className="p-6 text-right">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {allUsers.map(u => (
                                                <tr key={u.id} className="border-b border-slate-50">
                                                    <td className="p-6 font-bold">{u.name}</td>
                                                    <td className="p-6 text-center">{u.progress || 0}%</td>
                                                    <td className="p-6 text-right">
                                                        <button onClick={() => db.collection('artifacts').doc(appId).collection('public').doc('data').collection('users').doc(u.id).delete()} className="text-red-400"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {view === 'course' && activeCourse && (
                            <div className="max-w-5xl mx-auto">
                                <button onClick={() => setView('dashboard')} className="mb-6 flex items-center gap-2 text-slate-400 font-bold"><i data-lucide="arrow-left"></i> Back</button>
                                <div className="aspect-video bg-black rounded-[2.5rem] overflow-hidden mb-8 shadow-2xl">
                                    <iframe className="w-full h-full" src={`https://www.youtube.com/embed/${activeCourse.videoId}`} frameBorder="0" allowFullScreen></iframe>
                                </div>
                                <div className="bg-white p-10 rounded-[2.5rem] border border-slate-100 shadow-sm flex flex-col md:flex-row justify-between items-center">
                                    <div>
                                        <h2 className="text-2xl font-black italic uppercase">{activeCourse.title}</h2>
                                        <p className="text-slate-400">รับชมวิดีโอจบแล้วคลิกเพื่อทำข้อสอบ</p>
                                    </div>
                                    <button onClick={() => setView('quiz')} className="bg-red-600 text-white px-10 py-4 rounded-2xl font-bold shadow-xl mt-4 md:mt-0">เริ่มทำข้อสอบ</button>
                                </div>
                            </div>
                        )}

                        {view === 'quiz' && (
                            <div className="max-w-xl mx-auto py-10">
                                <div className="bg-white p-10 rounded-[2.5rem] shadow-2xl border border-slate-100 text-center">
                                    <h3 className="text-xl font-bold mb-8">{activeCourse.questions[currentQ].q}</h3>
                                    <div className="space-y-3">
                                        {activeCourse.questions[currentQ].options.map((opt, i) => (
                                            <button key={i} onClick={() => setUserAnswers({...userAnswers, [currentQ]: i})} className={`w-full p-5 rounded-2xl border-2 transition ${userAnswers[currentQ] === i ? 'border-red-600 bg-red-50' : 'border-slate-100'}`}>
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="mt-8 flex justify-center">
                                        <button onClick={submitQuiz} className="bg-slate-900 text-white px-10 py-4 rounded-2xl font-bold">ส่งคำตอบ</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'result' && (
                            <div className="flex flex-col items-center justify-center text-center p-6">
                                <h2 className="text-4xl font-black italic uppercase mb-2">Complete!</h2>
                                <p className="text-xl text-slate-400 font-bold mb-10">Score: {profile.coursesStatus[activeCourse.id].score}%</p>
                                <button onClick={() => setView('dashboard')} className="bg-slate-900 text-white px-10 py-4 rounded-2xl font-bold shadow-xl">Back to Home</button>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
