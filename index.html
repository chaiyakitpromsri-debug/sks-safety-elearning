<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKS Safety Enterprise - System Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap');
        body { font-family: 'Kanit', sans-serif; }
        .view { display: none; }
        .view.active { display: block; }
        .view.active-flex { display: flex; }
        .loader-dot { animation: dot 1.4s infinite linear; }
        @keyframes dot { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center text-white transition-opacity duration-500">
        <div class="flex flex-col items-center gap-6 px-6 text-center">
            <div class="relative">
                <div class="w-16 h-16 border-4 border-slate-800 rounded-full"></div>
                <div class="w-16 h-16 border-4 border-red-600 border-t-transparent rounded-full animate-spin absolute top-0 left-0"></div>
            </div>
            <div>
                <p class="font-bold italic text-xl tracking-widest mb-2">SKS SYSTEM INITIALIZING</p>
                <p id="loading-status" class="text-slate-500 text-sm font-mono">Connecting to services...</p>
            </div>
            <!-- Fallback Button if stuck -->
            <button id="retry-btn" onclick="location.reload()" class="hidden mt-4 px-6 py-2 bg-red-600 rounded-full text-xs font-bold animate-bounce">
                เชื่อมต่อนานผิดปกติ? กดเพื่อลองใหม่
            </button>
        </div>
    </div>

    <!-- 1. LOGIN / REGISTRATION VIEW -->
    <div id="view-login" class="view active-flex min-h-screen items-center justify-center bg-slate-900 p-6">
        <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-2xl w-full max-w-md">
            <div class="flex flex-col items-center mb-8">
                <div class="w-16 h-16 bg-red-100 flex items-center justify-center rounded-2xl mb-4">
                    <i data-lucide="shield-check" class="w-8 h-8 text-red-600"></i>
                </div>
                <h1 class="text-3xl font-black text-slate-800 italic">SKS SAFETY</h1>
                <p class="text-slate-400 text-sm tracking-widest">ENTERPRISE LMS</p>
            </div>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Email Address</label>
                    <input type="email" id="emailInput" required class="w-full p-4 mt-1 border-2 border-slate-100 rounded-2xl outline-none focus:border-red-600 transition" placeholder="owner@sks.com">
                </div>

                <div id="reg-fields" class="hidden space-y-4 pt-4 border-t border-slate-100 animate-in fade-in slide-in-from-top-2">
                    <p class="text-xs font-bold text-red-500 italic">ลงทะเบียนพนักงานใหม่</p>
                    <input type="text" id="regName" placeholder="ชื่อ-นามสกุล" class="w-full p-4 border-2 border-slate-100 rounded-2xl outline-none focus:border-red-600 transition">
                    <input type="text" id="regCompany" placeholder="ชื่อบริษัทขนส่ง" class="w-full p-4 border-2 border-slate-100 rounded-2xl outline-none focus:border-red-600 transition">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-red-600 shadow-xl transition-all disabled:opacity-50">
                    เข้าสู่ระบบ
                </button>
            </form>
            <p id="login-status-msg" class="mt-4 text-center text-xs text-slate-400 min-h-[1em]"></p>
        </div>
    </div>

    <!-- 2. MAIN APP INTERFACE -->
    <div id="view-main" class="view min-h-screen">
        <div class="flex min-h-screen">
            <!-- Sidebar -->
            <aside class="w-72 bg-slate-900 text-white p-8 hidden lg:flex flex-col fixed h-full">
                <div class="flex items-center gap-3 mb-10">
                    <div class="bg-red-600 p-2 rounded-lg"><i data-lucide="zap" class="w-5 h-5"></i></div>
                    <span class="font-bold text-xl tracking-tight italic uppercase">SKS Portal</span>
                </div>
                
                <nav id="nav-container" class="space-y-2 flex-1"></nav>

                <div class="pt-6 border-t border-slate-800">
                    <div id="user-info" class="mb-4">
                        <p id="user-display-name" class="font-bold text-sm truncate text-white"></p>
                        <p id="role-badge" class="text-[9px] font-black text-red-500 uppercase tracking-widest"></p>
                    </div>
                    <button onclick="location.reload()" class="flex items-center gap-3 text-slate-500 hover:text-white transition-colors font-bold text-sm"><i data-lucide="log-out" class="w-4 h-4"></i> ออกจากระบบ</button>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="flex-1 lg:ml-72 p-6 md:p-12">
                <!-- Sections: Manage Admins -->
                <section id="sec-manage-admins" class="hidden">
                    <h2 class="text-3xl font-black mb-8">จัดการสิทธิ์ Admin</h2>
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-200 mb-8">
                        <form id="addAdminForm" class="flex flex-col md:flex-row gap-4">
                            <input type="email" id="newAdminEmail" placeholder="ระบุ Email ผู้ช่วย Admin" required class="flex-1 p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-red-500">
                            <button class="bg-slate-900 text-white px-8 py-4 rounded-2xl font-bold hover:bg-red-600 transition-all">เพิ่มสิทธิ์</button>
                        </form>
                    </div>
                    <div class="bg-white rounded-[2rem] border border-slate-200 overflow-hidden" id="admin-list-container"></div>
                </section>

                <!-- Sections: Analytics -->
                <section id="sec-analytics" class="hidden">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-3xl font-black">ข้อมูลพนักงาน</h2>
                    </div>
                    <div class="bg-white rounded-[2rem] border border-slate-200 overflow-x-auto shadow-sm">
                        <table class="w-full text-left min-w-[600px]">
                            <thead class="bg-slate-50 text-[10px] font-black uppercase text-slate-400 border-b">
                                <tr>
                                    <th class="p-6">ชื่อ-นามสกุล / บริษัท</th>
                                    <th class="p-6">Progress</th>
                                    <th class="p-6">สถานะ</th>
                                </tr>
                            </thead>
                            <tbody id="trainee-table-body"></tbody>
                        </table>
                    </div>
                </section>

                <!-- Sections: Trainee View -->
                <section id="sec-trainee" class="hidden">
                    <h2 class="text-3xl font-black mb-8">บทเรียนและแบบทดสอบ</h2>
                    <div id="trainee-stats" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                        <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-sm relative overflow-hidden">
                            <p class="text-slate-400 text-[10px] font-black uppercase mb-2">My Learning Progress</p>
                            <h3 id="prog-percent" class="text-5xl font-black">0%</h3>
                        </div>
                        <div id="cert-box" class="bg-slate-900 p-8 rounded-[2rem] text-white hidden flex justify-between items-center shadow-xl">
                            <div>
                                <h3 class="text-2xl font-black italic">CERTIFIED</h3>
                                <p class="text-slate-400 text-sm font-bold">ผ่านเกณฑ์มาตรฐาน SKS Safety</p>
                            </div>
                            <i data-lucide="award" class="w-12 h-12 text-red-500"></i>
                        </div>
                    </div>
                    <div id="quiz-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
                </section>
            </main>
        </div>
    </div>

    <!-- MODAL -->
    <div id="quiz-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[110] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xl rounded-[2.5rem] p-8 md:p-12 max-h-[90vh] overflow-y-auto shadow-2xl relative">
            <button onclick="document.getElementById('quiz-modal').classList.add('hidden')" class="absolute top-6 right-6 text-slate-300 hover:text-slate-900"><i data-lucide="x"></i></button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // Global Vars
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sks-safety-main';
        const OWNER_EMAIL = 'owner@sks.com';

        let currentUser = null;
        let globalAdmins = [];
        let allQuizzes = [];
        let systemInitialized = false;

        const updateStatus = (msg) => {
            const el = document.getElementById('loading-status');
            if (el) el.innerText = msg;
        };

        // Rule 3: Auth First Pattern
        const startApp = async () => {
            updateStatus("Authenticating with Firebase...");
            
            // Timeout Fallback
            const timeoutId = setTimeout(() => {
                if (!systemInitialized) {
                    document.getElementById('retry-btn').classList.remove('hidden');
                    updateStatus("Connection slow. Still trying...");
                }
            }, 5000);

            try {
                await signInAnonymously(auth);
                
                onAuthStateChanged(auth, async (user) => {
                    if (user && !systemInitialized) {
                        systemInitialized = true;
                        clearTimeout(timeoutId);
                        updateStatus("Ready. Welcome to SKS.");
                        
                        // Load critical config
                        await loadGlobalConfig();
                        
                        // Hide loader
                        const loader = document.getElementById('loading-overlay');
                        loader.classList.add('opacity-0');
                        setTimeout(() => loader.remove(), 500);
                    }
                });
            } catch (err) {
                console.error("Auth error", err);
                updateStatus("Authentication failed. Please check internet.");
            }
        };

        const loadGlobalConfig = async () => {
            // Persistent Admin Listener
            const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'config', 'global');
            onSnapshot(configRef, (snap) => {
                if (snap.exists()) {
                    globalAdmins = snap.data().admins || [];
                } else {
                    setDoc(configRef, { admins: [] });
                }
                renderAdminList();
            }, (err) => console.log("Admin list limited", err));
        };

        // Login UI Logic
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim().toLowerCase();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('login-status-msg');

            btn.disabled = true;
            msg.innerText = "กำลังตรวจสอบบัญชี...";

            try {
                // Bypass for Owner
                if (email === OWNER_EMAIL) {
                    currentUser = { email, role: 'owner', name: 'SKS Owner', history: {} };
                    launchInterface();
                    return;
                }

                // Check Admin
                if (globalAdmins.includes(email)) {
                    currentUser = { email, role: 'admin', name: 'SKS Administrator', history: {} };
                    launchInterface();
                    return;
                }

                // Trainee Check
                const emailKey = email.replace(/[@.]/g, '_');
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', emailKey);
                const snap = await getDoc(userRef);

                if (snap.exists()) {
                    currentUser = snap.data();
                    launchInterface();
                } else {
                    const regFields = document.getElementById('reg-fields');
                    if (regFields.classList.contains('hidden')) {
                        regFields.classList.remove('hidden');
                        btn.innerText = 'ลงทะเบียนเข้าใช้งาน';
                        btn.disabled = false;
                        msg.innerText = "ไม่พบข้อมูล กรุณากรอกชื่อและบริษัทเพื่อลงทะเบียน";
                    } else {
                        const name = document.getElementById('regName').value.trim();
                        const company = document.getElementById('regCompany').value.trim();
                        if (!name || !company) throw new Error("กรุณากรอกข้อมูลให้ครบ");

                        currentUser = { email, name, company, role: 'trainee', history: {}, joined: new Date().toISOString() };
                        await setDoc(userRef, currentUser);
                        launchInterface();
                    }
                }
            } catch (err) {
                msg.innerText = err.message;
                btn.disabled = false;
            }
        };

        function launchInterface() {
            document.getElementById('view-login').classList.remove('active-flex');
            document.getElementById('view-main').classList.add('active');
            document.getElementById('user-display-name').innerText = currentUser.name;
            document.getElementById('role-badge').innerText = currentUser.role;

            buildNav();
            syncAppData();
        }

        function buildNav() {
            const nav = document.getElementById('nav-container');
            nav.innerHTML = '';
            const menu = [];

            if (currentUser.role === 'owner') menu.push({ id: 'manage-admins', icon: 'shield', label: 'จัดการสิทธิ์' });
            if (currentUser.role === 'owner' || currentUser.role === 'admin') menu.push({ id: 'analytics', icon: 'users', label: 'วิเคราะห์พนักงาน' });
            menu.push({ id: 'trainee', icon: 'play-circle', label: 'บทเรียนของฉัน' });

            menu.forEach(item => {
                const b = document.createElement('button');
                b.className = "w-full flex items-center gap-3 p-4 rounded-2xl text-slate-400 hover:bg-slate-800 transition-all font-bold text-sm";
                b.onclick = () => {
                    document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
                    document.getElementById(`sec-${item.id}`).classList.remove('hidden');
                };
                b.innerHTML = `<i data-lucide="${item.icon}" class="w-5 h-5"></i> <span>${item.label}</span>`;
                nav.appendChild(b);
            });
            document.getElementById(`sec-${menu[0].id}`).classList.remove('hidden');
            lucide.createIcons();
        }

        function syncAppData() {
            // Quizzes
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'quizzes'), (snap) => {
                allQuizzes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTraineeView();
            });

            // Analytics (Admin Only)
            if (currentUser.role !== 'trainee') {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (snap) => {
                    const tbody = document.getElementById('trainee-table-body');
                    if (!tbody) return;
                    tbody.innerHTML = '';
                    snap.forEach(d => {
                        const u = d.data();
                        if (u.role !== 'trainee') return;
                        const prog = allQuizzes.length ? Math.round((Object.keys(u.history||{}).length / allQuizzes.length) * 100) : 0;
                        tbody.innerHTML += `
                            <tr class="border-t border-slate-50">
                                <td class="p-6">
                                    <p class="font-bold text-slate-800">${u.name}</p>
                                    <p class="text-[9px] text-slate-400 uppercase tracking-widest">${u.company}</p>
                                </td>
                                <td class="p-6">
                                    <div class="w-32 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                        <div class="h-full bg-red-600" style="width:${prog}%"></div>
                                    </div>
                                </td>
                                <td class="p-6"><span class="text-[10px] font-black uppercase">${prog === 100 ? 'Completed' : 'Learning'}</span></td>
                            </tr>
                        `;
                    });
                });
            }

            // Real-time Current User
            if (currentUser.role === 'trainee') {
                const emailKey = currentUser.email.replace(/[@.]/g, '_');
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'users', emailKey), (snap) => {
                    if (snap.exists()) {
                        currentUser = snap.data();
                        renderTraineeView();
                    }
                });
            }
        }

        // Render functions
        function renderAdminList() {
            const c = document.getElementById('admin-list-container');
            if (!c) return;
            if (!globalAdmins.length) {
                c.innerHTML = `<p class="p-10 text-center text-slate-400 text-sm italic">ยังไม่มีผู้ช่วยแอดมิน</p>`;
                return;
            }
            c.innerHTML = globalAdmins.map(email => `
                <div class="flex justify-between items-center p-6 border-b border-slate-50 last:border-none">
                    <span class="font-bold text-slate-700">${email}</span>
                    <button onclick="removeAdmin('${email}')" class="text-slate-300 hover:text-red-500"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.removeAdmin = async (email) => {
            if (confirm(`ยกเลิกสิทธิ์ Admin ของ ${email}?`)) {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'global'), { admins: arrayRemove(email) });
            }
        };

        function renderTraineeView() {
            const list = document.getElementById('quiz-list');
            if (!list) return;
            list.innerHTML = '';
            let done = 0;
            
            allQuizzes.forEach(q => {
                const isDone = !!(currentUser.history || {})[q.id];
                if (isDone) done++;
                list.innerHTML += `
                    <div class="bg-white p-8 rounded-[2rem] border border-slate-200 flex flex-col justify-between shadow-sm hover:shadow-lg transition-all">
                        <div>
                            <div class="w-12 h-12 bg-slate-50 rounded-xl flex items-center justify-center mb-6 text-slate-300">
                                <i data-lucide="${isDone ? 'check-circle' : 'play-circle'}" class="w-6 h-6 ${isDone ? 'text-emerald-500' : ''}"></i>
                            </div>
                            <h4 class="text-xl font-bold text-slate-800 mb-2">${q.topic}</h4>
                            <p class="text-[10px] text-slate-400 font-black uppercase mb-8">${q.questions.length} Questions</p>
                        </div>
                        <button onclick="startQuiz('${q.id}')" ${isDone ? 'disabled' : ''} class="w-full py-4 rounded-xl font-black text-sm ${isDone ? 'bg-slate-50 text-slate-300' : 'bg-slate-900 text-white hover:bg-red-600'} transition-all">
                            ${isDone ? 'COMPLETED' : 'START LESSON'}
                        </button>
                    </div>
                `;
            });

            const p = allQuizzes.length ? Math.round((done / allQuizzes.length) * 100) : 0;
            document.getElementById('prog-percent').innerText = `${p}%`;
            if (p === 100 && allQuizzes.length > 0) document.getElementById('cert-box').classList.remove('hidden');
            lucide.createIcons();
        }

        window.startQuiz = (id) => {
            const q = allQuizzes.find(x => x.id === id);
            const modal = document.getElementById('quiz-modal');
            modal.classList.remove('hidden');
            document.getElementById('modal-content').innerHTML = `
                <div class="mb-8"><h3 class="text-3xl font-black">${q.topic}</h3></div>
                <form id="activeQuizForm" class="space-y-8">
                    ${q.questions.map((item, idx) => `
                        <div class="space-y-4">
                            <p class="font-bold text-lg text-slate-800">${idx+1}. ${item.q}</p>
                            <div class="grid gap-2">
                                ${item.choices.map((c, ci) => `
                                    <label class="p-4 bg-slate-50 rounded-xl flex items-center gap-3 cursor-pointer hover:bg-slate-100">
                                        <input type="radio" name="q${idx}" value="${ci}" required class="w-5 h-5 accent-red-600">
                                        <span class="font-bold text-slate-700">${c}</span>
                                    </label>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                    <button class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black shadow-xl hover:bg-red-600">ส่งคำตอบ</button>
                </form>
            `;

            document.getElementById('activeQuizForm').onsubmit = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                let score = 0;
                q.questions.forEach((it, idx) => { if (parseInt(fd.get(`q${idx}`)) === it.correct) score++; });

                if (score === q.questions.length) {
                    const key = currentUser.email.replace(/[@.]/g, '_');
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', key), {
                        [`history.${id}`]: { score, at: new Date().toISOString() }
                    });
                    modal.classList.add('hidden');
                    alert("เก่งมาก! คุณสอบผ่าน 100%");
                } else {
                    alert(`คุณได้ ${score}/${q.questions.length} คะแนน ต้องได้เต็มเท่านั้นจึงจะผ่าน`);
                }
            };
        };

        // Start
        startApp();
        lucide.createIcons();

    </script>
</body>
</html>
