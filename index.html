<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKS Safety E-Learning</title>
    <!-- ใช้งาน Tailwind CSS และ Lucide Icons ผ่าน CDN (ไม่ต้องติดตั้ง) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap');
        body { font-family: 'Kanit', sans-serif; }
        .view { display: none; }
        .view.active { display: block; }
        .view.active-flex { display: flex; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- 1. ส่วนหน้า LOGIN -->
    <div id="view-login" class="view active-flex min-h-screen items-center justify-center bg-slate-900 p-6">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md text-center">
            <div class="w-20 h-20 bg-red-50 flex items-center justify-center rounded-3xl mx-auto mb-6">
                <i data-lucide="shield" class="w-10 h-10 text-red-600"></i>
            </div>
            <h1 class="text-3xl font-bold mb-2">SKS Safety</h1>
            <p class="text-slate-500 mb-8">E-Learning & Data Tracking</p>
            <form id="loginForm" class="space-y-4 text-left">
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase ml-2">Email Address</label>
                    <input type="email" id="emailInput" required class="w-full p-4 mt-1 border-2 border-slate-100 rounded-2xl outline-none focus:border-red-600 transition" placeholder="name@company.com">
                </div>
                <button type="submit" class="w-full bg-red-600 text-white py-4 rounded-2xl font-bold hover:bg-red-700 shadow-lg shadow-red-200 transition-all">เข้าสู่ระบบ</button>
            </form>
            <div class="mt-8 p-4 bg-slate-50 rounded-2xl">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Owner Access</p>
                <p class="text-sm text-slate-600 font-mono">owner@sks.com</p>
            </div>
        </div>
    </div>

    <!-- 2. ส่วนหน้าจอหลักหลัง Login -->
    <div id="view-main" class="view min-h-screen">
        <div class="flex min-h-screen">
            <!-- Sidebar เมนูข้าง -->
            <aside class="w-72 bg-slate-900 text-white p-8 hidden md:flex flex-col">
                <div class="flex items-center gap-3 mb-12">
                    <div class="bg-red-600 p-2 rounded-lg"><i data-lucide="shield" class="w-6 h-6 text-white"></i></div>
                    <h1 class="font-bold text-xl tracking-tight">SKS Safety</h1>
                </div>
                <nav class="space-y-2 flex-1">
                    <button onclick="showSection('dashboard')" class="nav-btn w-full flex items-center gap-3 p-4 rounded-2xl transition hover:bg-slate-800 text-slate-400" id="btn-dash">
                        <i data-lucide="layout"></i> <span class="font-bold">หน้าหลัก</span>
                    </button>
                    <div id="admin-only-menu" class="hidden">
                        <button onclick="showSection('admin')" class="nav-btn w-full flex items-center gap-3 p-4 rounded-2xl transition hover:bg-slate-800 text-slate-400" id="btn-admin">
                            <i data-lucide="users"></i> <span class="font-bold">จัดการผู้ใช้</span>
                        </button>
                    </div>
                </nav>
                <button onclick="location.reload()" class="flex items-center gap-3 p-4 text-slate-500 hover:text-white transition">
                    <i data-lucide="log-out"></i> ออกจากระบบ
                </button>
            </aside>

            <!-- Main Content ส่วนเนื้อหา -->
            <main class="flex-1 p-6 md:p-12 overflow-y-auto">
                <!-- Section: Dashboard (หน้าของพนักงาน) -->
                <section id="section-dashboard" class="content-section">
                    <header class="mb-10">
                        <h2 class="text-4xl font-bold text-slate-800">สวัสดี, <span id="display-name">...</span></h2>
                        <div class="flex items-center gap-2 mt-2">
                            <span id="display-role" class="px-3 py-1 bg-red-100 text-red-600 rounded-full text-xs font-bold uppercase"></span>
                            <span class="text-slate-400 text-sm">| SKS Safety Platform</span>
                        </div>
                    </header>
                    <div id="course-list" class="grid grid-cols-1 md:grid-cols-2 gap-8 text-slate-900">
                        <!-- บทเรียนจะโหลดจากระบบ -->
                    </div>
                </section>

                <!-- Section: Admin (หน้าจัดการสิทธิ์ - เฉพาะ Owner/Admin) -->
                <section id="section-admin" class="content-section hidden">
                    <h2 class="text-3xl font-bold mb-8 text-slate-800">ระบบจัดการผู้ได้รับอนุญาต (Whitelist)</h2>
                    <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 mb-10">
                        <form id="addUserForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <input id="newName" placeholder="ชื่อ-นามสกุล" required class="p-4 border-2 border-slate-50 rounded-2xl outline-none focus:border-red-600 transition">
                            <input id="newEmail" type="email" placeholder="อีเมล (เมลจริง)" required class="p-4 border-2 border-slate-50 rounded-2xl outline-none focus:border-red-600 transition">
                            <select id="newRole" class="p-4 border-2 border-slate-50 rounded-2xl outline-none bg-white">
                                <option value="trainee">Trainee (พนักงาน)</option>
                                <option value="admin">Admin (หัวหน้า)</option>
                            </select>
                            <button type="submit" class="bg-red-600 text-white font-bold rounded-2xl hover:bg-red-700 shadow-lg shadow-red-100">เพิ่มสิทธิ์</button>
                        </form>
                    </div>
                    <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-50/50">
                                <tr>
                                    <th class="p-6 text-slate-400 font-bold uppercase text-[10px]">รายชื่อ</th>
                                    <th class="p-6 text-slate-400 font-bold uppercase text-[10px]">สิทธิ์</th>
                                    <th class="p-6 text-slate-400 font-bold uppercase text-[10px] text-right">ลบ</th>
                                </tr>
                            </thead>
                            <tbody id="user-table-body" class="text-slate-900">
                                <!-- รายชื่อโหลดจาก Firebase -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- ส่วนเชื่อมต่อ Firebase (Backend) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        // Firebase Config ของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyB0VSrOyHI5YBEcJ69Kn8TUQpKtxO0b26w",
            authDomain: "safety-e-learning-15c6e.firebaseapp.com",
            projectId: "safety-e-learning-15c6e",
            storageBucket: "safety-e-learning-15c6e.firebasestorage.app",
            messagingSenderId: "382531903014",
            appId: "1:382531903014:web:e256139500555a4145d0e7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = "sks-safety-elearning";

        let currentUserProfile = null;

        // ตรวจสอบการ Login ตลอดเวลา
        onAuthStateChanged(auth, async (user) => {
            if (!user) await signInAnonymously(auth);
            lucide.createIcons();
        });

        // จัดการการส่งฟอร์ม Login
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.toLowerCase();
            const docId = email.replace(/[@.]/g, '_');
            
            const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', docId);
            const userDoc = await getDoc(userRef);

            if (userDoc.exists()) {
                loginSuccess(userDoc.data());
            } else if (email === 'owner@sks.com') {
                const ownerData = { email, name: 'SKS Owner', role: 'owner' };
                await setDoc(userRef, ownerData);
                loginSuccess(ownerData);
            } else {
                alert('ไม่พบอีเมลนี้ในระบบสิทธิ์การใช้งาน กรุณาติดต่อ Admin');
            }
        };

        function loginSuccess(profile) {
            currentUserProfile = profile;
            document.getElementById('view-login').classList.remove('active-flex');
            document.getElementById('view-main').classList.add('active');
            document.getElementById('display-name').innerText = profile.name;
            document.getElementById('display-role').innerText = profile.role;

            if (profile.role === 'owner' || profile.role === 'admin') {
                document.getElementById('admin-only-menu').classList.remove('hidden');
                initAdminSync();
            }
            showSection('dashboard');
            initCourseSync();
        }

        // ระบบเปลี่ยนหน้าจอ
        window.showSection = (sectionName) => {
            document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`section-${sectionName}`).classList.remove('hidden');
            
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('bg-red-600', 'text-white'));
            const activeBtn = sectionName === 'dashboard' ? 'btn-dash' : 'btn-admin';
            document.getElementById(activeBtn).classList.add('bg-red-600', 'text-white');
            lucide.createIcons();
        };

        // ดึงข้อมูลรายชื่อพนักงานแบบ Real-time
        function initAdminSync() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (snap) => {
                const tbody = document.getElementById('user-table-body');
                tbody.innerHTML = '';
                snap.forEach(docSnap => {
                    const u = docSnap.data();
                    const row = `
                        <tr class="border-t border-slate-50 hover:bg-slate-50/30 transition text-slate-900">
                            <td class="p-6">
                                <div class="font-bold">${u.name}</div>
                                <div class="text-xs text-slate-400">${u.email}</div>
                            </td>
                            <td class="p-6">
                                <span class="px-3 py-1 rounded-lg text-[10px] font-black uppercase ${u.role === 'admin' ? 'bg-purple-100 text-purple-600' : 'bg-blue-100 text-blue-600'}">
                                    ${u.role}
                                </span>
                            </td>
                            <td class="p-6 text-right">
                                <button onclick="deleteUser('${docSnap.id}')" class="text-slate-300 hover:text-red-500 transition-colors">
                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
                lucide.createIcons();
            });
        }

        window.deleteUser = async (id) => {
            if(confirm('ยืนยันการลบสิทธิ์ผู้ใช้นี้?')) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', id));
            }
        };

        // ฟังก์ชันเพิ่มรายชื่อพนักงาน
        document.getElementById('addUserForm').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('newName').value;
            const email = document.getElementById('newEmail').value.toLowerCase();
            const role = document.getElementById('newRole').value;
            const docId = email.replace(/[@.]/g, '_');
            
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', docId), {
                name, email, role, coursesStatus: {}
            });
            e.target.reset();
            alert('เพิ่มรายชื่อสำเร็จ!');
        };

        function initCourseSync() {
            const courses = [
                { title: "ความปลอดภัยในการขับขี่", desc: "พื้นฐานการใช้งานยานพาหนะในคลัง" },
                { title: "การสวมใส่อุปกรณ์ PPE", desc: "ความสำคัญและการเลือกใช้อุปกรณ์ป้องกัน" }
            ];
            const container = document.getElementById('course-list');
            container.innerHTML = courses.map(c => `
                <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 relative overflow-hidden group">
                    <div class="relative z-10">
                        <h3 class="text-xl font-bold mb-2">${c.title}</h3>
                        <p class="text-slate-500 text-sm mb-8">${c.desc}</p>
                        <button class="bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold hover:bg-red-600 transition-colors">เข้าเรียนเนื้อหา</button>
                    </div>
                </div>
            `).join('');
        }

    </script>
</body>
</html>
