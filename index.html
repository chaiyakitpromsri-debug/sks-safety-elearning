<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKS Safety Enterprise - Owner Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap');
        body { font-family: 'Kanit', sans-serif; }
        .view { display: none; }
        .view.active { display: block; }
        .view.active-flex { display: flex; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- 1. LOGIN / REGISTRATION VIEW -->
    <div id="view-login" class="view active-flex min-h-screen items-center justify-center bg-slate-900 p-6">
        <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-2xl w-full max-w-md">
            <div class="flex flex-col items-center mb-8">
                <div class="w-16 h-16 bg-red-100 flex items-center justify-center rounded-2xl mb-4">
                    <i data-lucide="shield-check" class="w-8 h-8 text-red-600"></i>
                </div>
                <h1 class="text-3xl font-black text-slate-800 italic">SKS SAFETY</h1>
                <p class="text-slate-400 text-sm">Learning Management System</p>
            </div>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Email Address</label>
                    <input type="email" id="emailInput" required class="w-full p-4 mt-1 border-2 border-slate-100 rounded-2xl outline-none focus:border-red-600 transition" placeholder="example@email.com">
                </div>

                <!-- Hidden registration fields for Trainee -->
                <div id="reg-fields" class="hidden space-y-4 pt-4 border-t border-slate-100">
                    <p class="text-xs font-bold text-red-500 italic">กรุณาลงทะเบียนพนักงานใหม่</p>
                    <input type="text" id="regName" placeholder="ชื่อ-นามสกุล" class="w-full p-4 border-2 border-slate-100 rounded-2xl outline-none focus:border-red-600 transition">
                    <input type="text" id="regCompany" placeholder="ชื่อบริษัทขนส่ง" class="w-full p-4 border-2 border-slate-100 rounded-2xl outline-none focus:border-red-600 transition">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-red-600 shadow-xl transition-all">
                    เข้าสู่ระบบ
                </button>
            </form>
        </div>
    </div>

    <!-- 2. MAIN APP INTERFACE -->
    <div id="view-main" class="view min-h-screen">
        <div class="flex min-h-screen">
            <!-- Sidebar -->
            <aside class="w-72 bg-slate-900 text-white p-8 hidden lg:flex flex-col fixed h-full">
                <div class="flex items-center gap-3 mb-10">
                    <div class="bg-red-600 p-2 rounded-lg"><i data-lucide="zap" class="w-5 h-5"></i></div>
                    <span class="font-bold text-xl">SKS Portal</span>
                </div>
                
                <nav id="nav-container" class="space-y-2 flex-1">
                    <!-- Nav items will be injected here based on role -->
                </nav>

                <div class="pt-6 border-t border-slate-800">
                    <p id="role-badge" class="text-[10px] font-bold text-slate-500 mb-4 uppercase tracking-widest"></p>
                    <button onclick="location.reload()" class="flex items-center gap-3 text-red-400 hover:text-white transition-colors font-bold"><i data-lucide="log-out"></i> Logout</button>
                </div>
            </aside>

            <!-- Content Area -->
            <main class="flex-1 lg:ml-72 p-6 md:p-12">
                
                <!-- OWNER: Manage Admins -->
                <section id="sec-manage-admins" class="hidden">
                    <h2 class="text-3xl font-black mb-8">จัดการสิทธิ์ Admin</h2>
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-200 mb-8">
                        <form id="addAdminForm" class="flex gap-4">
                            <input type="email" id="newAdminEmail" placeholder="ระบุ Email ที่ต้องการให้เป็น Admin" required class="flex-1 p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 ring-red-500">
                            <button class="bg-slate-900 text-white px-8 rounded-2xl font-bold hover:bg-red-600">เพิ่มสิทธิ์</button>
                        </form>
                    </div>
                    <div class="bg-white rounded-[2rem] border border-slate-200 overflow-hidden" id="admin-list-container">
                        <!-- Admin list -->
                    </div>
                </section>

                <!-- OWNER: Quiz Builder -->
                <section id="sec-quiz-builder" class="hidden">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-3xl font-black">สร้างแบบทดสอบ</h2>
                        <span class="bg-red-100 text-red-600 px-4 py-1 rounded-full text-xs font-bold">Deploy Mode</span>
                    </div>
                    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 max-w-2xl">
                        <div class="space-y-6">
                            <input type="text" id="quiz-topic" placeholder="ชื่อหัวข้อ (Topic)" class="w-full p-4 bg-slate-50 rounded-2xl border-none text-xl font-bold outline-none">
                            <div id="questions-area" class="space-y-6"></div>
                            <button onclick="addQuestionField()" class="w-full py-4 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 font-bold hover:border-red-400 hover:text-red-500 transition-all">+ เพิ่มคำถาม</button>
                            <button onclick="saveQuiz()" class="w-full py-4 bg-red-600 text-white rounded-2xl font-bold shadow-lg shadow-red-100 hover:scale-[1.02] active:scale-95 transition-all">FINISH & DEPLOY</button>
                        </div>
                    </div>
                </section>

                <!-- ADMIN: Trainee Analytics -->
                <section id="sec-analytics" class="hidden">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-3xl font-black">ข้อมูลการฝึกอบรม</h2>
                        <button onclick="exportCSV()" class="bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 hover:bg-emerald-700 transition-all">
                            <i data-lucide="download"></i> Export CSV
                        </button>
                    </div>
                    <div class="bg-white rounded-[2rem] border border-slate-200 overflow-hidden shadow-sm">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-[10px] font-black uppercase text-slate-400">
                                <tr>
                                    <th class="p-6">พนักงาน / บริษัท</th>
                                    <th class="p-6">Progress</th>
                                    <th class="p-6">สถานะ</th>
                                    <th class="p-6 text-right">วันล่าสุด</th>
                                </tr>
                            </thead>
                            <tbody id="trainee-table-body"></tbody>
                        </table>
                    </div>
                </section>

                <!-- TRAINEE: My Progress -->
                <section id="sec-trainee" class="hidden">
                    <h2 class="text-3xl font-black mb-8">บทเรียนของฉัน</h2>
                    <div id="trainee-stats" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                        <div class="bg-white p-8 rounded-[2rem] border border-slate-200">
                            <p class="text-slate-400 text-[10px] font-black uppercase mb-2">Learning Progress</p>
                            <h3 id="prog-percent" class="text-5xl font-black">0%</h3>
                        </div>
                        <div id="cert-box" class="bg-amber-400 p-8 rounded-[2rem] text-white hidden flex justify-between items-center">
                            <div>
                                <h3 class="text-2xl font-black">ยินดีด้วย!</h3>
                                <p class="text-amber-900/60 font-bold">คุณผ่านการอบรมครบถ้วน</p>
                            </div>
                            <button onclick="viewCert()" class="bg-white text-amber-500 p-4 rounded-2xl shadow-xl hover:scale-110 transition-all"><i data-lucide="award"></i></button>
                        </div>
                    </div>
                    <div id="quiz-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
                </section>

            </main>
        </div>
    </div>

    <!-- MODAL FOR QUIZ -->
    <div id="quiz-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xl rounded-[2.5rem] p-10 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div id="modal-content"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sks-safety-v2';
        const OWNER_EMAIL = 'owner@sks.com';

        let currentUser = null;
        let globalAdmins = [];
        let allQuizzes = [];

        // 1. Initialize Auth & Global Config
        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'global'), (snap) => {
                    if (snap.exists()) {
                        globalAdmins = snap.data().admins || [];
                    } else {
                        setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'global'), { admins: [] });
                    }
                    renderAdminList();
                });
            }
            lucide.createIcons();
        });
        signInAnonymously(auth);

        // 2. Login Logic
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.toLowerCase();
            const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', email.replace(/[@.]/g, '_'));
            const userSnap = await getDoc(userRef);

            if (email === OWNER_EMAIL) {
                currentUser = { email, role: 'owner', name: 'System Owner' };
                launchApp();
            } else if (globalAdmins.includes(email)) {
                currentUser = { email, role: 'admin', name: 'Administrator' };
                launchApp();
            } else {
                if (userSnap.exists()) {
                    currentUser = userSnap.data();
                    launchApp();
                } else {
                    const regFields = document.getElementById('reg-fields');
                    if (regFields.classList.contains('hidden')) {
                        regFields.classList.remove('hidden');
                        document.getElementById('submitBtn').innerText = 'ลงทะเบียนพนักงาน';
                    } else {
                        const name = document.getElementById('regName').value;
                        const company = document.getElementById('regCompany').value;
                        if (!name || !company) return alert("กรุณากรอกข้อมูลให้ครบ");
                        currentUser = { email, name, company, role: 'trainee', history: {}, joined: new Date().toISOString() };
                        await setDoc(userRef, currentUser);
                        launchApp();
                    }
                }
            }
        };

        function launchApp() {
            document.getElementById('view-login').classList.remove('active-flex');
            document.getElementById('view-main').classList.add('active');
            document.getElementById('role-badge').innerText = `Role: ${currentUser.role}`;
            setupNavigation();
            syncData();
        }

        // 3. Navigation & Security
        function setupNavigation() {
            const nav = document.getElementById('nav-container');
            nav.innerHTML = '';
            const menu = [];

            if (currentUser.role === 'owner') {
                menu.push({ id: 'manage-admins', icon: 'user-plus', label: 'จัดการ Admin' });
                menu.push({ id: 'quiz-builder', icon: 'plus-circle', label: 'สร้างแบบทดสอบ' });
            }
            if (currentUser.role === 'owner' || currentUser.role === 'admin') {
                menu.push({ id: 'analytics', icon: 'bar-chart-3', label: 'Dashboard Admin' });
            }
            menu.push({ id: 'trainee', icon: 'book-open', label: 'บทเรียนของฉัน' });

            menu.forEach(item => {
                nav.innerHTML += `
                    <button onclick="showSection('${item.id}')" class="w-full flex items-center gap-3 p-4 rounded-2xl text-slate-400 hover:bg-slate-800 transition-all">
                        <i data-lucide="${item.icon}"></i> <span class="font-bold">${item.label}</span>
                    </button>
                `;
            });
            showSection(menu[0].id);
            lucide.createIcons();
        }

        window.showSection = (id) => {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`sec-${id}`).classList.remove('hidden');
        };

        // 4. Owner & Admin Sync
        function syncData() {
            // Sync Quiz
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'quizzes'), (snap) => {
                allQuizzes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTraineeView();
            });

            // Sync Trainees (for Owner/Admin)
            if (currentUser.role !== 'trainee') {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (snap) => {
                    const tbody = document.getElementById('trainee-table-body');
                    tbody.innerHTML = '';
                    snap.forEach(docSnap => {
                        const u = docSnap.data();
                        if (u.role !== 'trainee') return;
                        const progress = Math.round((Object.keys(u.history || {}).length / (allQuizzes.length || 1)) * 100);
                        tbody.innerHTML += `
                            <tr class="border-t border-slate-50 hover:bg-slate-50/50">
                                <td class="p-6">
                                    <p class="font-bold">${u.name}</p>
                                    <p class="text-[10px] text-slate-400 font-black uppercase">${u.company}</p>
                                </td>
                                <td class="p-6">
                                    <div class="w-24 bg-slate-100 h-2 rounded-full overflow-hidden">
                                        <div class="bg-red-500 h-full" style="width:${progress}%"></div>
                                    </div>
                                </td>
                                <td class="p-6"><span class="text-xs px-3 py-1 rounded-full ${progress === 100 ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400'} font-bold">${progress}%</span></td>
                                <td class="p-6 text-right text-xs text-slate-400 font-mono">${u.joined.split('T')[0]}</td>
                            </tr>
                        `;
                    });
                });
            }

            // Sync My Own History (for Trainee UI)
            if (currentUser.role === 'trainee') {
                onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.email.replace(/[@.]/g, '_')), (snap) => {
                    if (snap.exists()) {
                        currentUser = snap.data();
                        renderTraineeView();
                    }
                });
            }
        }

        // --- OWNER FEATURES ---
        document.getElementById('addAdminForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('newAdminEmail').value.toLowerCase();
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'global'), { admins: arrayUnion(email) });
            document.getElementById('newAdminEmail').value = '';
            alert("เพิ่ม Admin สำเร็จ");
        };

        window.removeAdmin = async (email) => {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'config', 'global'), { admins: arrayRemove(email) });
        };

        function renderAdminList() {
            const container = document.getElementById('admin-list-container');
            if (!container) return;
            container.innerHTML = globalAdmins.map(email => `
                <div class="flex justify-between items-center p-6 border-b border-slate-50">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center"><i data-lucide="user" class="w-4 h-4"></i></div>
                        <span class="font-bold">${email}</span>
                    </div>
                    <button onclick="removeAdmin('${email}')" class="text-slate-300 hover:text-red-500"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // --- QUIZ BUILDER ---
        let currentBuildQuestions = [];
        window.addQuestionField = () => {
            const qId = currentBuildQuestions.length;
            currentBuildQuestions.push({ q: '', choices: ['', '', ''], correct: 0 });
            const area = document.getElementById('questions-area');
            const div = document.createElement('div');
            div.className = "p-6 bg-slate-50 rounded-2xl space-y-4 border border-slate-100";
            div.innerHTML = `
                <input type="text" onchange="updateQ(${qId}, 'q', this.value)" placeholder="โจทย์คำถามที่ ${qId+1}" class="w-full p-3 rounded-xl border-none font-bold outline-none">
                <div class="space-y-2">
                    ${[0,1,2].map(i => `
                        <div class="flex items-center gap-2">
                            <input type="radio" name="correct-${qId}" onchange="updateQ(${qId}, 'correct', ${i})" ${i===0?'checked':''}>
                            <input type="text" onchange="updateQChoice(${qId}, ${i}, this.value)" placeholder="ตัวเลือก ${i+1}" class="flex-1 p-2 rounded-lg text-sm outline-none border-none">
                        </div>
                    `).join('')}
                </div>
            `;
            area.appendChild(div);
        };
        window.updateQ = (id, key, val) => currentBuildQuestions[id][key] = val;
        window.updateQChoice = (id, ci, val) => currentBuildQuestions[id].choices[ci] = val;
        
        window.saveQuiz = async () => {
            const topic = document.getElementById('quiz-topic').value;
            if (!topic || currentBuildQuestions.length === 0) return alert("ข้อมูลไม่ครบ");
            const qId = 'quiz_' + Date.now();
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'quizzes', qId), {
                topic, questions: currentBuildQuestions, createdAt: new Date().toISOString()
            });
            alert("Deploy สำเร็จ!");
            document.getElementById('questions-area').innerHTML = '';
            document.getElementById('quiz-topic').value = '';
            currentBuildQuestions = [];
        };

        // --- TRAINEE ACTIONS ---
        function renderTraineeView() {
            const list = document.getElementById('quiz-list');
            if (!list) return;
            list.innerHTML = '';
            let completedCount = 0;

            allQuizzes.forEach(q => {
                const isDone = currentUser.history && currentUser.history[q.id];
                if (isDone) completedCount++;
                list.innerHTML += `
                    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 flex flex-col justify-between">
                        <div>
                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center mb-6 ${isDone ? 'bg-emerald-100 text-emerald-600':'bg-slate-100 text-slate-300'}">
                                <i data-lucide="${isDone ? 'check-circle' : 'circle'}"></i>
                            </div>
                            <h4 class="text-xl font-bold mb-1">${q.topic}</h4>
                            <p class="text-xs text-slate-400 mb-8">${q.questions.length} คำถาม</p>
                        </div>
                        <button onclick="startQuiz('${q.id}')" ${isDone ? 'disabled':''} class="w-full py-4 rounded-2xl font-black ${isDone ? 'bg-slate-100 text-slate-300':'bg-slate-900 text-white hover:bg-red-600 transition-all'}">
                            ${isDone ? 'สำเร็จแล้ว' : 'เริ่มทดสอบ'}
                        </button>
                    </div>
                `;
            });

            const prog = Math.round((completedCount / (allQuizzes.length || 1)) * 100);
            document.getElementById('prog-percent').innerText = `${prog}%`;
            if (prog === 100 && allQuizzes.length > 0) document.getElementById('cert-box').classList.remove('hidden');
            lucide.createIcons();
        }

        window.startQuiz = (id) => {
            const q = allQuizzes.find(item => item.id === id);
            const modal = document.getElementById('quiz-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            content.innerHTML = `
                <h3 class="text-2xl font-black mb-8">${q.topic}</h3>
                <form id="activeQuizForm" class="space-y-8">
                    ${q.questions.map((item, idx) => `
                        <div class="space-y-4">
                            <p class="font-bold text-slate-700">${idx+1}. ${item.q}</p>
                            <div class="grid grid-cols-1 gap-2">
                                ${item.choices.map((choice, ci) => `
                                    <label class="flex items-center gap-3 p-4 bg-slate-50 rounded-2xl cursor-pointer hover:bg-red-50 transition-all">
                                        <input type="radio" name="q${idx}" value="${ci}" required class="w-4 h-4 accent-red-600">
                                        <span class="text-sm font-medium">${choice}</span>
                                    </label>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                    <button type="submit" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black shadow-xl shadow-red-100">ส่งคำตอบ</button>
                </form>
            `;

            document.getElementById('activeQuizForm').onsubmit = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                let score = 0;
                q.questions.forEach((item, idx) => {
                    if (parseInt(fd.get(`q${idx}`)) === item.correct) score++;
                });

                if (score === q.questions.length) {
                    const uRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.email.replace(/[@.]/g, '_'));
                    await updateDoc(uRef, { [`history.${id}`]: { score, date: new Date().toISOString() } });
                    alert("ยินดีด้วย! คุณผ่านเกณฑ์");
                    modal.classList.add('hidden');
                } else {
                    alert(`คะแนนของคุณ ${score}/${q.questions.length} ยังไม่ผ่านเกณฑ์ (ต้องได้ 100%)`);
                }
            };
        };

        // --- EXPORT ---
        window.exportCSV = async () => {
            const snap = await getDoc(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
            let csv = "Name,Company,Email,Progress\n";
            const users = []; // in real app fetch all docs
            // Simulating fetch and loop
            alert("ระบบกำลังเตรียมข้อมูล CSV พนักงาน...");
        };

        window.viewCert = () => {
            alert(`ใบประกาศนียบัตร: คุณ ${currentUser.name} ได้ผ่านการอบรมระบบ SKS Safety ครบถ้วนแล้ว`);
        }

    </script>
</body>
</html>
