<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKS Safety LMS - High Performance</title>
    
    <!-- CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; margin: 0; overflow: hidden; }
        .hidden { display: none !important; }
        .active-link { background-color: #ef4444 !important; color: white !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body class="bg-slate-50">

    <!-- Loading Overlay -->
    <div id="loading-screen" class="fixed inset-0 z-[999] bg-slate-900 flex items-center justify-center text-white flex-col gap-4">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-red-600"></i>
        <p class="animate-pulse">กำลังโหลดระบบ SKS Safety...</p>
    </div>

    <!-- Application Root -->
    <div id="app" class="h-screen w-full flex overflow-hidden hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-20 md:w-64 bg-slate-900 text-white flex flex-col p-4 z-50">
            <div class="flex items-center gap-3 mb-10 px-2 justify-center md:justify-start">
                <i class="fa-solid fa-shield-halved text-2xl text-red-500"></i>
                <span class="hidden md:block font-bold text-xl italic tracking-tighter uppercase">SKS Safety</span>
            </div>
            <nav class="flex-1 space-y-2" id="main-nav"></nav>
            <div class="mt-auto pt-4 border-t border-slate-800">
                <div id="user-info" class="mb-4 hidden md:block px-2">
                    <p id="user-role-label" class="text-[10px] font-bold text-red-500 uppercase tracking-widest"></p>
                    <p id="user-name-label" class="text-sm font-bold truncate"></p>
                </div>
                <button onclick="logout()" class="w-full flex items-center gap-3 p-3 text-slate-400 hover:text-white transition group">
                    <i class="fa-solid fa-right-from-bracket w-6 text-center group-hover:translate-x-1 transition-transform"></i>
                    <span class="hidden md:block">ออกจากระบบ</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col overflow-hidden relative">
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 md:px-8">
                <h2 id="page-title" class="font-bold text-lg text-slate-700">หน้าหลัก</h2>
                <div class="text-[10px] text-slate-400 font-bold flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <span id="sync-status">LIVE SYNC ACTIVE</span>
                </div>
            </header>
            <section id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar bg-slate-50"></section>
        </main>
    </div>

    <!-- Auth Screens -->
    <div id="auth-container" class="fixed inset-0 z-[100] bg-slate-900 flex items-center justify-center p-4 hidden">
        <div id="login-view" class="bg-white p-8 rounded-[2.5rem] w-full max-w-md shadow-2xl animate-fade">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-white shadow-inner">
                    <i class="fa-solid fa-shield-halved text-4xl text-red-600"></i>
                </div>
                <h1 class="text-3xl font-black italic text-slate-900 tracking-tighter">SKS SAFETY</h1>
                <p class="text-slate-400 text-sm font-medium mt-1 uppercase tracking-widest">Enterprise LMS</p>
            </div>
            <form id="login-form" class="space-y-4">
                <input type="email" id="login-email" required placeholder="อีเมล (เช่น owner@sks.com)" 
                    class="w-full p-4 bg-slate-100 rounded-2xl outline-none border-2 border-transparent focus:border-red-500 focus:bg-white transition-all font-medium" />
                <button type="submit" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-bold hover:bg-red-600 transition-all shadow-xl">ลงชื่อเข้าใช้งาน</button>
            </form>
        </div>
        <div id="register-view" class="bg-white p-8 rounded-[2.5rem] w-full max-w-md shadow-2xl animate-fade hidden">
            <h2 class="text-2xl font-bold mb-2">ลงทะเบียนพนักงาน</h2>
            <form id="register-form" class="space-y-4">
                <input type="text" id="reg-name" placeholder="ชื่อ-นามสกุล" required class="w-full p-4 bg-slate-100 rounded-2xl outline-none" />
                <input type="text" id="reg-company" placeholder="บริษัท / แผนก" required class="w-full p-4 bg-slate-100 rounded-2xl outline-none" />
                <button type="submit" class="w-full bg-red-600 text-white p-4 rounded-2xl font-bold shadow-lg mt-4">บันทึกข้อมูลและเข้าเรียน</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK (ใช้แบบ Compatibility mode เพื่อให้ตรงกับโค้ดเดิมของคุณ) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        /**
         * แผนผังข้อมูลสำหรับ Data Engineer:
         * 1. firebaseConfig: ตั้งค่ากุญแจเชื่อมต่อ (Credentials)
         * 2. init(): ฟังก์ชันเริ่มต้นระบบ (Ingestion Setup)
         * 3. startDataListeners(): ระบบดึงข้อมูลแบบ Real-time (Streaming)
         */

        const firebaseConfig = {
            apiKey: "AIzaSyB0VSrOyHI5YBEcJ69Kn8TUQpKtxO0b26w",
            authDomain: "safety-e-learning-15c6e.firebaseapp.com",
            projectId: "safety-e-learning-15c6e",
            storageBucket: "safety-e-learning-15c6e.firebasestorage.app",
            messagingSenderId: "382531903014",
            appId: "1:382531903014:web:e256139500555a4145d0e7",
            measurementId: "G-DDE8ZRSDEB"
        };

        const APP_ID = 'sks-safety-v11';
        const OWNER_EMAIL = "owner@sks.com";

        // Initialize
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let currentProfile = null;
        let courses = [];
        let allUsers = [];
        let currentView = 'dashboard';
        let unsubCourses = null;
        let unsubUsers = null;

        async function init() {
            try {
                // ขั้นตอน Authentication: ต้องรอก่อนจะดึงข้อมูล
                await auth.signInAnonymously();
                
                auth.onAuthStateChanged(user => {
                    if (user) {
                        currentUser = user;
                        showLogin();
                    }
                    hideLoading();
                });
            } catch (error) {
                console.error("Initialization Failed:", error);
                document.getElementById('sync-status').innerText = "CONNECTION ERROR";
            }
        }

        function showLogin() {
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('app').classList.add('hidden');
        }

        function hideLoading() {
            document.getElementById('loading-screen').classList.add('hidden');
        }

        // PATH HELPER: จัดโครงสร้างข้อมูลใน Firestore ให้เป็นระเบียบ (Rule 1)
        const getPublicCollection = (col) => db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(col);

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const emailKey = email.replace(/[@.]/g, '_');

            if (email === OWNER_EMAIL) {
                const data = { email, name: 'System Owner', role: 'owner', company: 'SKS CENTRAL', progress: 0 };
                await getPublicCollection('users').doc(emailKey).set(data, {merge: true});
                loginSuccess(data);
                return;
            }

            const doc = await getPublicCollection('users').doc(emailKey).get();
            if (doc.exists) {
                loginSuccess(doc.data());
            } else {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('register-view').classList.remove('hidden');
            }
        };

        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const emailKey = email.replace(/[@.]/g, '_');
            const data = {
                email,
                name: document.getElementById('reg-name').value,
                company: document.getElementById('reg-company').value,
                role: 'trainee',
                progress: 0,
                joinedAt: new Date().toISOString()
            };
            await getPublicCollection('users').doc(emailKey).set(data);
            loginSuccess(data);
        };

        function loginSuccess(profile) {
            currentProfile = profile;
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            updateSidebar();
            startDataListeners();
            renderView('dashboard');
        }

        function startDataListeners() {
            if (unsubCourses) unsubCourses();
            if (unsubUsers) unsubUsers();

            // Stream Courses: ฟังความเปลี่ยนแปลงของบทเรียน
            unsubCourses = getPublicCollection('courses').onSnapshot(s => {
                courses = s.docs.map(d => ({id: d.id, ...d.data()}));
                if(currentView === 'dashboard') renderDashboard();
            }, err => console.error("Course Stream Error", err));

            // Stream Users: สำหรับ Admin/Owner
            if (['admin', 'owner'].includes(currentProfile.role)) {
                unsubUsers = getPublicCollection('users').onSnapshot(s => {
                    allUsers = s.docs.map(d => ({id: d.id, ...d.data()}));
                    if(currentView === 'users') renderUsers();
                }, err => console.error("User Stream Error", err));
            }
        }

        // UI Rendering Logic... (เหมือนเดิม)
        function updateSidebar() {
            const nav = document.getElementById('main-nav');
            const role = currentProfile.role;
            document.getElementById('user-role-label').innerText = role;
            document.getElementById('user-name-label').innerText = currentProfile.name;

            let html = `<button onclick="renderView('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center gap-3 p-3 rounded-2xl transition hover:bg-slate-800">
                <i class="fa-solid fa-house w-6"></i> <span class="hidden md:block">หน้าหลัก</span>
            </button>`;

            if (role === 'owner') {
                html += `<button onclick="renderView('builder')" id="nav-builder" class="nav-btn w-full flex items-center gap-3 p-3 rounded-2xl transition hover:bg-slate-800">
                    <i class="fa-solid fa-plus w-6"></i> <span class="hidden md:block">สร้างบทเรียน</span>
                </button>`;
            }

            if (['owner', 'admin'].includes(role)) {
                html += `<button onclick="renderView('users')" id="nav-users" class="nav-btn w-full flex items-center gap-3 p-3 rounded-2xl transition hover:bg-slate-800">
                    <i class="fa-solid fa-users-gear w-6"></i> <span class="hidden md:block">จัดการพนักงาน</span>
                </button>`;
            }
            nav.innerHTML = html;
        }

        function renderView(viewName) {
            currentView = viewName;
            const container = document.getElementById('content-area');
            const title = document.getElementById('page-title');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-link'));
            const activeBtn = document.getElementById(`nav-${viewName}`);
            if(activeBtn) activeBtn.classList.add('active-link');

            container.innerHTML = `<div class="animate-pulse space-y-4"><div class="h-8 bg-slate-200 rounded w-1/4"></div><div class="h-64 bg-slate-200 rounded-3xl"></div></div>`;

            setTimeout(() => {
                if(viewName === 'dashboard') { title.innerText = 'แดชบอร์ด'; renderDashboard(); }
                else if(viewName === 'builder') { title.innerText = 'สร้างบทเรียน'; renderBuilder(); }
                else if(viewName === 'users') { title.innerText = 'จัดการพนักงาน'; renderUsers(); }
            }, 50);
        }

        function renderDashboard() {
            const container = document.getElementById('content-area');
            const cards = courses.map(c => `
                <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm hover:shadow-xl transition-all">
                    <div class="h-40 bg-slate-900 rounded-2xl mb-4 flex items-center justify-center text-white italic font-bold">
                        <i class="fa-solid fa-shield-halved text-3xl opacity-20"></i>
                    </div>
                    <h3 class="font-bold text-lg mb-1">${c.title}</h3>
                    <p class="text-slate-500 text-xs mb-6 line-clamp-2">${c.desc || '-'}</p>
                    <button onclick="startLearning('${c.id}')" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-red-600 transition-colors">เข้าเรียน</button>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="max-w-6xl mx-auto animate-fade">
                    <div class="flex justify-between items-end mb-8">
                        <div>
                            <h1 class="text-3xl font-black text-slate-900">สวัสดี, ${currentProfile.name}</h1>
                            <p class="text-slate-400 font-medium">บริษัท: ${currentProfile.company}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">${cards || '<p class="text-slate-400">ยังไม่มีบทเรียนในขณะนี้</p>'}</div>
                </div>`;
        }

        function renderBuilder() {
            document.getElementById('content-area').innerHTML = `
                <div class="max-w-2xl mx-auto animate-fade bg-white p-8 rounded-[2.5rem] border shadow-sm">
                    <h2 class="text-xl font-bold mb-6 italic underline decoration-red-500 underline-offset-8">เพิ่มหลักสูตรใหม่</h2>
                    <div class="space-y-4">
                        <input id="c-title" placeholder="ชื่อวิชา" class="w-full p-4 bg-slate-50 rounded-2xl border" />
                        <textarea id="c-desc" placeholder="คำอธิบายสั้นๆ" class="w-full p-4 bg-slate-50 rounded-2xl border h-24"></textarea>
                        <input id="c-video" placeholder="Link วิดีโอ (YouTube/MP4)" class="w-full p-4 bg-slate-50 rounded-2xl border" />
                        <button onclick="handleSaveCourse()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-red-600 transition-all">ยืนยันการเพิ่มบทเรียน</button>
                    </div>
                </div>`;
        }

        async function handleSaveCourse() {
            const title = document.getElementById('c-title').value;
            if(!title) return;
            await getPublicCollection('courses').add({
                title, desc: document.getElementById('c-desc').value,
                videoUrl: document.getElementById('c-video').value,
                createdAt: new Date().toISOString()
            });
            renderView('dashboard');
        }

        function renderUsers() {
            const rows = allUsers.map(u => `
                <tr class="border-b border-slate-50">
                    <td class="p-4 font-bold text-sm">${u.name}</td>
                    <td class="p-4 text-xs text-slate-500">${u.company}</td>
                    <td class="p-4 text-xs font-bold text-red-600">${u.progress || 0}%</td>
                    <td class="p-4 uppercase text-[10px] font-black text-slate-400">${u.role}</td>
                    <td class="p-4">
                        ${currentProfile.role === 'owner' && u.email !== OWNER_EMAIL ? 
                            `<button onclick="toggleAdmin('${u.id}', '${u.role}')" class="text-[10px] bg-slate-100 px-2 py-1 rounded hover:bg-slate-900 hover:text-white transition-all">PROMOTE/DEMOTE</button>` 
                        : '-'}
                    </td>
                </tr>
            `).join('');
            document.getElementById('content-area').innerHTML = `
                <div class="max-w-5xl mx-auto animate-fade bg-white rounded-[2rem] border overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                            <tr><th class="p-4">NAME</th><th class="p-4">COMPANY</th><th class="p-4">PROGRESS</th><th class="p-4">ROLE</th><th class="p-4">ACTION</th></tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
        }

        async function toggleAdmin(id, role) {
            const user = allUsers.find(u => u.id === id);
            const key = user.email.replace(/[@.]/g, '_');
            await getPublicCollection('users').doc(key).update({ role: role === 'admin' ? 'trainee' : 'admin' });
        }

        function startLearning(id) {
            const c = courses.find(course => course.id === id);
            document.getElementById('content-area').innerHTML = `
                <div class="max-w-4xl mx-auto animate-fade">
                    <button onclick="renderView('dashboard')" class="mb-4 text-slate-400 font-bold">← ย้อนกลับ</button>
                    <div class="aspect-video bg-black rounded-3xl mb-6 flex items-center justify-center text-white p-8 text-center border-4 border-white shadow-lg">
                        <div>
                            <i class="fa-solid fa-circle-play text-6xl text-red-600 mb-4"></i>
                            <h2 class="text-2xl font-bold">${c.title}</h2>
                            <p class="text-slate-400 mt-2">${c.videoUrl || 'ไม่มีลิงก์วิดีโอ'}</p>
                        </div>
                    </div>
                    <div class="bg-white p-8 rounded-3xl border text-center shadow-sm">
                        <h3 class="font-bold text-xl mb-2">บทเรียนสมบูรณ์แล้ว?</h3>
                        <p class="text-slate-400 text-sm mb-6">คลิกปุ่มด้านล่างเพื่อเริ่มทำแบบทดสอบและบันทึกผลการเรียน</p>
                        <button onclick="alert('ระบบสอบกำลังเปิดให้ใช้งานเร็วๆ นี้')" class="bg-red-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-red-100">เริ่มทำข้อสอบ</button>
                    </div>
                </div>`;
        }

        function logout() { window.location.reload(); }

        init();
    </script>
</body>
</html>
