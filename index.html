<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SKS Safety E-Learning</title>
    
    <!-- ส่วนแก้ปัญหา LOGO บนแท็บเบราว์เซอร์ -->
    <link rel="icon" type="image/png" href="https://github.com/chaiyakitpromsri-debug/web-assets/blob/main/logo/del_bg.png?raw=true">
    <link rel="apple-touch-icon" href="https://github.com/chaiyakitpromsri-debug/web-assets/blob/main/logo/del_bg.png?raw=true">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; color: #111827; margin: 0; }
        .bg-sks-red { background-color: #dc2626; }
        .text-sks-red { color: #dc2626; }
        .border-sks-red { border-color: #dc2626; }
        .btn-red { background-color: #dc2626; color: white; transition: all 0.2s; border: none; cursor: pointer; }
        .btn-red:hover { background-color: #b91c1c; }
        
        .formal-card { border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .formal-input { border-radius: 0.5rem; }
        .formal-btn { border-radius: 0.5rem; }

        @media print {
            .no-print { display: none !important; }
            body { background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            /* ตั้งค่าหน้ากระดาษเป็นแนวนอนและลบขอบขาว */
            @page { size: A4 landscape; margin: 0; }
            .print-container { 
                width: 100% !important;
                height: 100vh !important;
                margin: 0 !important; 
                padding: 0 !important; 
                box-shadow: none !important; 
                border: none !important; 
                overflow: hidden !important;
                background-color: white !important;
                position: absolute;
                top: 0;
                left: 0;
                z-index: 9999; /* แก้ไข: เพิ่ม z-index เพื่อให้แน่ใจว่าอยู่บนสุด */
            }
            .cert-wrapper {
                box-shadow: none !important;
                margin: 0 !important;
                /* ปรับขนาดให้พอดีกับ A4 แนวนอนตอนพิมพ์ */
                transform: scale(1) !important;
                transform-origin: top left !important;
                left: 0 !important;
                top: 0 !important;
            }
        }

        /* --- CERTIFICATE OVERLAY STYLES --- */
        .cert-wrapper {
            width: 1123px; /* ความกว้าง A4 แนวนอน (pixel approx @96dpi) */
            height: 794px; /* ความสูง A4 แนวนอน */
            position: relative;
            background-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin: 0 auto;
            overflow: hidden;
            
            /* Background Image เดิม */
            background-image: url('https://github.com/chaiyakitpromsri-debug/web-assets/blob/main/logo/certificate_upload.png?raw=true');
            background-size: contain; 
            background-repeat: no-repeat;
            background-position: center;
        }

        /* แก้ไข: เพิ่ม class สำหรับรูปภาพ Template ให้แสดงผลถูกต้อง */
        .cert-template-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* สไตล์ข้อความที่จะนำไปวางทับ (Overlay Text) */
        .cert-data-text {
            position: absolute;
            z-index: 10;
            color: #00a2e8; /* สีฟ้าตามที่ขอ */
            font-weight: bold;
            text-align: center;
            transform: translate(-50%, -50%); /* จัดกึ่งกลางจากจุด anchor */
            left: 50%; /* เริ่มต้นที่กึ่งกลางหน้ากระดาษ */
            width: 80%; /* ความกว้างพื้นที่ข้อความ */
        }

        /* --- ตำแหน่งข้อความ (ปรับจูนได้ที่นี่) --- */
        
        .pos-name { 
            top: 43.5%;        /* ระยะจากบนลงล่าง (0-100%) */
            left: 70%;       /* ระยะจากซ้ายไปขวา (50% คือกึ่งกลาง) */
            font-size: 42px; /* ขนาดตัวอักษร */
            color: #1e3a8a;  /* สีตัวอักษร (น้ำเงินเข้ม) */
        }

        /* 2. ชื่อบริษัท */
        .pos-company { 
            top: 53%;      
            left: 59%;     
            font-size: 24px;
            color: #1e3a8a;
            text-align: left;
            transform: translateY(-50%) !important; /* จัดชิดซ้ายใช้แค่ Y */
        }
        
        /* 3. ชื่อคอร์ส */
        .pos-course { 
            top: 57%;      
            left: 70%;     
            font-size: 18px;
            color: #1e3a8a;
        }

        /* 4. วันที่ */
        .pos-date { 
            top: 64%;      
            left: 63.5%;     
            font-size: 20px;
            color: #475569;
            text-align: left;
            transform: translateY(-50%) !important;
        }

    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { createRoot } = ReactDOM;

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    iconRef.current.innerHTML = '';
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    if (className) iconElement.className = className;
                    iconElement.style.width = `${size}px`;
                    iconElement.style.height = `${size}px`;
                    iconElement.style.display = 'inline-block';
                    iconRef.current.appendChild(iconElement);
                    window.lucide.createIcons({ node: iconRef.current });
                }
            }, [name, size, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const firebaseConfig = {
            apiKey: "AIzaSyCTVPEG8h9T1OU7fv5nQyKifSC-vAyr1Bo",
            authDomain: "driver-training-program.firebaseapp.com",
            projectId: "driver-training-program",
            storageBucket: "driver-training-program.firebasestorage.app",
            messagingSenderId: "231400779221",
            appId: "1:231400779221:web:877e508c2f3d2f053ca15c",
            measurementId: "G-KBMVK6JH0G"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function App() {
            const [view, setView] = useState('loading'); 
            const [user, setUser] = useState(null); 
            const [courses, setCourses] = useState([]);
            const [allUsers, setAllUsers] = useState([]);
            const [activeCourse, setActiveCourse] = useState(null);
            
            const [quizQuestions, setQuizQuestions] = useState([]);
            const [currentQ, setCurrentQ] = useState(0);
            const [userAnswers, setUserAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(0);

            const [filters, setFilters] = useState({ name: '', company: '' });
            const [editingCourse, setEditingCourse] = useState(null);
            
            const [tempQ, setTempQ] = useState({ q: '', options: ['', '', '', ''], a: 0 });
            
            const fileInputRef = useRef(null);

            useEffect(() => {
                const unsub = db.collection('courses').onSnapshot(snap => {
                    setCourses(snap.docs.map(doc => ({id: doc.id, ...doc.data()})));
                }, console.error);
                checkSession();
                return () => unsub();
            }, []);

            useEffect(() => {
                if (view && view.startsWith('admin_')) {
                    const unsub = db.collection('users').onSnapshot(snap => {
                        setAllUsers(snap.docs.map(doc => ({id: doc.id, ...doc.data()})));
                    });
                    return () => unsub();
                }
            }, [view]);

            useEffect(() => {
                if (view === 'quiz' && timeLeft > 0) {
                    const timerId = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timerId);
                                handleAutoSubmit(); 
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                    return () => clearInterval(timerId);
                }
            }, [timeLeft, view]);

            const checkSession = () => {
                const savedId = localStorage.getItem('sks_user_id_v2');
                if (savedId) {
                    db.collection('users').doc(savedId).get().then(doc => {
                        if (doc.exists) {
                            const u = {id: doc.id, ...doc.data()};
                            setUser(u);
                            setView(u.role === 'admin' ? 'admin_dashboard' : 'dashboard');
                        } else {
                            localStorage.removeItem('sks_user_id_v2');
                            setView('login');
                        }
                    }).catch(() => setView('login'));
                } else {
                    setView('login');
                }
            };

            const logout = () => { 
                localStorage.clear(); 
                setUser(null); 
                setView('login'); 
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                const n = e.target.fname.value.trim();
                const c = e.target.company.value.trim();
                const s = e.target.secret.value;
                if (!n || !c) return;

                const safeName = n.toLowerCase().replace(/\s/g, '_');
                const safeCompany = c.toLowerCase().replace(/\s/g, '_');
                const userId = `${safeName}_${safeCompany}`;

                const isAdmin = s === 'sks_admin_master';
                const uRef = db.collection('users').doc(userId);
                
                try {
                    const doc = await uRef.get();
                    if (!doc.exists) {
                        await uRef.set({ name: n, company: c, role: isAdmin ? 'admin' : 'user', coursesStatus: {} });
                    } else {
                        await uRef.update({ role: isAdmin ? 'admin' : 'user' });
                    }
                    localStorage.setItem('sks_user_id_v2', userId);
                    checkSession();
                } catch (error) { alert("Login Error: " + error.message); }
            };

            const exportToCSV = (data) => {
                const courseHeaders = courses.map(c => `"${c.titleTh}"`).join(",");
                const headers = `Name,Company,${courseHeaders}`;
                
                const rows = data.map(u => {
                    const courseStatuses = courses.map(c => {
                        const s = u.coursesStatus?.[c.id];
                        if (s?.status === 'Passed') return `"${s.status} (${s.date})"`; 
                        if (s?.status === 'Failed') return `"ไม่ผ่าน"`;
                        return `"ยังไม่ได้เรียน"`;
                    }).join(",");
                    return `"${u.name}","${u.company}",${courseStatuses}`;
                });
                
                const csvContent = "\uFEFF" + [headers, ...rows].join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", "SKS_Trainee_Report.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const text = evt.target.result;
                    const lines = text.split('\n');
                    let successCount = 0;
                    const batch = db.batch();
                    let operationCount = 0;
                    lines.forEach((line) => {
                        const [rawName, rawCompany] = line.split(',').map(s => s?.trim()?.replace(/^"|"$/g, ''));
                        if (rawName && rawCompany && rawName !== "Name") {
                            const uid = `${rawName.toLowerCase().replace(/\s/g, '_')}_${rawCompany.toLowerCase().replace(/\s/g, '_')}`;
                            const ref = db.collection('users').doc(uid);
                            batch.set(ref, { name: rawName, company: rawCompany, role: 'user' }, { merge: true });
                            operationCount++;
                            successCount++;
                        }
                    });
                    if (operationCount > 0) {
                        await batch.commit();
                        alert(`Successfully imported ${successCount} users.`);
                    } else {
                        alert("No valid data found.");
                    }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const handleAddQuestion = () => {
                if (!tempQ.q || tempQ.options.some(o => !o)) return alert("Please fill all fields");
                const updatedQuestions = [...(editingCourse?.questions || []), tempQ];
                setEditingCourse({ ...editingCourse, questions: updatedQuestions });
                setTempQ({ q: '', options: ['', '', '', ''], a: 0 }); 
            };

            const handleRemoveQuestion = (index) => {
                const updatedQuestions = editingCourse.questions.filter((_, i) => i !== index);
                setEditingCourse({ ...editingCourse, questions: updatedQuestions });
            };

            const extractVideoId = (url) => {
                if (!url) return '';
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
                const match = url.match(regExp);
                return (match && match[2].length === 11) ? match[2] : url;
            };

            const handleSaveCourse = async (e) => {
                e.preventDefault();
                const title = e.target.title.value;
                const videoIdInput = e.target.videoId.value;
                const imageUrl = e.target.imageUrl.value;
                const timeLimit = parseInt(e.target.timeLimit.value) || 0; 
                
                const videoId = extractVideoId(videoIdInput);

                if (!editingCourse?.questions?.length) return alert("Please add at least one question.");

                const newCourse = {
                    titleTh: title,
                    videoId: videoId,
                    imageUrl: imageUrl || '',
                    timeLimit: timeLimit,
                    passScore: 80,
                    questions: editingCourse.questions
                };

                if (editingCourse?.id) {
                    await db.collection('courses').doc(editingCourse.id).update(newCourse);
                } else {
                    await db.collection('courses').add(newCourse);
                }
                setEditingCourse(null);
                setView('admin_courses');
            };

            const handleDeleteCourse = async (courseId) => {
                if(confirm('ยืนยันการลบหลักสูตรนี้ใช่หรือไม่? ข้อมูลคะแนนของผู้เรียนในหลักสูตรนี้จะไม่สามารถเรียกคืนได้')) {
                    try {
                        await db.collection('courses').doc(courseId).delete();
                    } catch (error) {
                        alert("เกิดข้อผิดพลาดในการลบ: " + error.message);
                    }
                }
            };

            const handleAutoSubmit = async () => {
                await submitQuiz(true);
            };

            const submitQuiz = async (isAuto = false) => {
                let correct = 0;
                quizQuestions.forEach((q, i) => { if(userAnswers[i] === q.a) correct++; });
                const score = Math.round((correct / quizQuestions.length) * 100);
                const pass = score >= (activeCourse?.passScore || 80);
                const res = { status: pass?'Passed':'Failed', score, date: new Date().toLocaleDateString('th-TH') };
                const newStatus = { ...user.coursesStatus, [activeCourse.id]: res };
                
                await db.collection('users').doc(user.id).update({ coursesStatus: newStatus });
                setUser({...user, coursesStatus: newStatus}); 
                
                if(isAuto) alert("หมดเวลา! ระบบส่งคำตอบอัตโนมัติ");
                setView('result');
            };

            const startQuiz = () => {
                if(!activeCourse?.questions?.length) return alert("Course content is being updated.");
                
                const shuffledQuestions = [...activeCourse.questions]
                    .sort(() => Math.random() - 0.5)
                    .map(q => {
                        const optionsWithIndex = q.options.map((opt, idx) => ({ opt, originalIdx: idx }));
                        const shuffledOptions = optionsWithIndex.sort(() => Math.random() - 0.5);
                        const newCorrectIndex = shuffledOptions.findIndex(item => item.originalIdx === q.a);
                        return { q: q.q, options: shuffledOptions.map(item => item.opt), a: newCorrectIndex };
                    });

                setQuizQuestions(shuffledQuestions);
                setCurrentQ(0); 
                setUserAnswers({});
                setTimeLeft(activeCourse.timeLimit > 0 ? activeCourse.timeLimit * 60 : 0);
                setView('quiz');
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const renderVideo = (url) => {
                if (!url) return <div className="w-full h-full flex items-center justify-center text-white opacity-20">Video Not Found</div>;
                const isYouTube = url.includes('youtube.com') || url.includes('youtu.be') || url.length === 11;
                if (isYouTube) {
                    const vid = url.includes('v=') ? url.split('v=')[1].split('&')[0] : (url.includes('be/') ? url.split('be/')[1] : url);
                    return <iframe className="w-full h-full" src={`https://www.youtube.com/embed/${vid}`} frameBorder="0" allowFullScreen></iframe>;
                } else {
                    return <video className="w-full h-full" controls controlsList="nodownload"><source src={url} type="video/mp4" /></video>;
                }
            };

            // --- VIEWS ---

            if (view === 'loading') return <div className="h-screen flex items-center justify-center font-bold text-slate-400 animate-pulse">SKS Loading...</div>;

            if (view === 'login') return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                    <div className="bg-white formal-card w-full max-w-md overflow-hidden border border-slate-200">
                        <div className="bg-black p-8 text-center border-b-4 border-sks-red">
                            <h1 className="text-white font-bold text-2xl uppercase tracking-wider">SKS E-Learning</h1>
                            <p className="text-sks-red text-xs font-semibold tracking-widest mt-2">SAFETY MANAGEMENT SYSTEM</p>
                        </div>
                        <form onSubmit={handleLogin} className="p-8 space-y-4">
                            <div>
                                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Company</label>
                                <input name="company" placeholder="ระบุบริษัทสังกัด" required className="formal-input w-full p-3 bg-slate-50 border border-slate-200 focus:border-sks-red outline-none text-sm"/>
                            </div>
                            <div>
                                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Full Name</label>
                                <input name="fname" placeholder="ชื่อ-นามสกุล" required className="formal-input w-full p-3 bg-slate-50 border border-slate-200 focus:border-sks-red outline-none text-sm"/>
                            </div>
                            <input name="secret" type="password" placeholder="Admin Code (Optional)" className="w-full text-center text-xs text-slate-300 outline-none hover:text-slate-900 mt-2 bg-transparent border-none"/>
                            <button type="submit" className="formal-btn btn-red w-full py-3 font-bold uppercase text-sm shadow-md mt-4">Sign In</button>
                        </form>
                    </div>
                </div>
            );

            if (view === 'dashboard') {
                const totalCourses = courses.length;
                const completedCourses = courses.filter(c => user.coursesStatus?.[c.id]?.status === 'Passed').length;
                const progressPercent = totalCourses > 0 ? Math.round((completedCourses / totalCourses) * 100) : 0;

                return (
                    <div className="min-h-screen bg-slate-50">
                        <header className="bg-black text-white p-4 px-6 flex justify-between items-center sticky top-0 z-50 shadow-md">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-sks-red rounded-lg flex items-center justify-center font-bold italic text-sm">S</div>
                                <h1 className="font-bold text-lg uppercase tracking-tight">SKS Safety</h1>
                            </div>
                            <button onClick={logout} className="text-white hover:text-sks-red transition-all"><Icon name="log-out" size={20}/></button>
                        </header>
                        <main className="max-w-5xl mx-auto p-4 md:p-8">
                            <div className="bg-white formal-card p-6 mb-8 border-l-4 border-sks-red flex flex-col md:flex-row justify-between items-center gap-6">
                                <div>
                                    <h2 className="text-2xl font-bold text-slate-800">Welcome, {user.name}</h2>
                                    <p className="text-slate-500 text-sm uppercase font-bold tracking-wider">{user.company}</p>
                                </div>
                                <div className="w-full md:w-1/2">
                                    <div className="flex justify-between text-xs font-bold uppercase text-slate-400 mb-2">
                                        <span>Progress</span>
                                        <span>{progressPercent}% ({completedCourses}/{totalCourses} Courses)</span>
                                    </div>
                                    <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                                        <div className="bg-sks-red h-3 transition-all duration-500" style={{width: `${progressPercent}%`}}></div>
                                    </div>
                                </div>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {courses.map(course => {
                                    const s = user?.coursesStatus?.[course.id];
                                    const isPassed = s?.status === 'Passed';
                                    return (
                                        <div key={course.id} className="bg-white formal-card overflow-hidden flex flex-col group hover:shadow-lg transition-all border border-slate-100">
                                            <div className="h-40 bg-slate-200 relative overflow-hidden">
                                                {course.imageUrl ? <img src={course.imageUrl} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" /> : <div className="w-full h-full flex items-center justify-center text-slate-400"><Icon name="image" size={40}/></div>}
                                                {isPassed && <div className="absolute top-2 right-2 bg-green-500 text-white text-[10px] font-bold px-2 py-1 rounded-md uppercase">Completed</div>}
                                            </div>
                                            <div className="p-6 flex-1 flex flex-col">
                                                <h3 className="font-bold text-lg leading-tight mb-4 flex-1">{course.titleTh}</h3>
                                                <div className="flex flex-col gap-2">
                                                    <button onClick={() => { setActiveCourse(course); setView('course'); }} className={`formal-btn w-full py-3 font-bold text-xs uppercase tracking-wider transition-all ${isPassed?'bg-black text-white hover:bg-slate-800':'btn-red'}`}>
                                                        {isPassed ? 'Review Course' : 'Start Course'}
                                                    </button>
                                                    {isPassed && (
                                                        <button onClick={() => { setActiveCourse(course); setView('certificate'); }} className="formal-btn w-full py-3 border border-slate-200 font-bold text-xs uppercase tracking-wider hover:bg-slate-50 text-slate-600 flex items-center justify-center gap-2">
                                                            <Icon name="printer" size={14}/> Certificate
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </main>
                    </div>
                );
            }

            if (view === 'course') return (
                <div className="min-h-screen bg-white">
                    <header className="p-4 border-b border-slate-100 flex justify-between items-center max-w-5xl mx-auto">
                        <button onClick={() => setView('dashboard')} className="flex items-center gap-2 text-slate-500 font-bold text-xs hover:text-black uppercase"><Icon name="arrow-left" size={16}/> Back</button>
                        <h2 className="font-bold text-sm uppercase truncate max-w-[200px]">{activeCourse?.titleTh}</h2>
                        <div className="w-10"></div>
                    </header>
                    <main className="max-w-4xl mx-auto p-4 md:p-8">
                        <div className="aspect-video bg-black rounded-xl overflow-hidden shadow-lg mb-8">
                            {renderVideo(activeCourse?.videoId)}
                        </div>
                        <div className="text-center">
                            <div className="mb-4 text-slate-500 text-sm">{activeCourse.timeLimit > 0 ? `Time Limit: ${activeCourse.timeLimit} Minutes` : 'No Time Limit'}</div>
                            <button onClick={startQuiz} className="formal-btn btn-red px-10 py-4 font-bold text-lg uppercase tracking-widest shadow-lg">Start Exam</button>
                        </div>
                    </main>
                </div>
            );

            if (view === 'quiz') {
                const q = quizQuestions[currentQ];
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white p-8 w-full max-w-3xl formal-card relative">
                            <div className="flex justify-between items-center mb-8 border-b pb-4">
                                <span className="font-bold text-sks-red text-xl uppercase">Exam</span>
                                <div className="text-right">
                                    <span className="font-bold text-slate-400 text-xs tracking-widest block">Q: {currentQ + 1} / {quizQuestions.length}</span>
                                    {activeCourse.timeLimit > 0 && <span className={`font-black text-lg ${timeLeft < 60 ? 'text-red-600 animate-pulse' : 'text-slate-800'}`}>{formatTime(timeLeft)}</span>}
                                </div>
                            </div>
                            <h3 className="text-xl font-bold text-slate-900 mb-8">{q?.q}</h3>
                            <div className="grid grid-cols-1 gap-4 mb-8">
                                {q?.options.map((opt, i) => (
                                    <button key={i} onClick={() => setUserAnswers({...userAnswers, [currentQ]: i})} className={`w-full p-4 text-left rounded-lg border-2 transition-all font-semibold text-base ${userAnswers[currentQ] === i ? 'bg-slate-900 text-white border-slate-900' : 'border-slate-100 hover:border-sks-red text-slate-600 bg-white'}`}>
                                        <span className="text-sks-red mr-3 font-bold">{i+1}.</span> {opt}
                                    </button>
                                ))}
                            </div>
                            <div className="flex justify-between items-center">
                                <button disabled={currentQ === 0} onClick={() => setCurrentQ(currentQ - 1)} className="text-slate-400 font-bold uppercase text-xs disabled:opacity-0 bg-transparent border-none">Previous</button>
                                {currentQ < quizQuestions.length - 1 ? (
                                    <button disabled={userAnswers[currentQ] === undefined} onClick={() => setCurrentQ(currentQ + 1)} className="bg-black text-white px-8 py-3 formal-btn font-bold uppercase text-xs disabled:opacity-20">Next</button>
                                ) : (
                                    <button disabled={userAnswers[currentQ] === undefined} onClick={() => submitQuiz(false)} className="btn-red px-8 py-3 formal-btn font-bold uppercase text-xs">Submit</button>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'result') {
                const res = user?.coursesStatus[activeCourse?.id];
                const passed = res?.status === 'Passed';
                return (
                    <div className="min-h-screen bg-slate-100 flex items-center justify-center p-6 text-center">
                        <div className="bg-white p-12 w-full max-w-md formal-card border-t-8 border-black">
                            <Icon name={passed?'award':'alert-circle'} size={64} className={passed?'text-green-500 mx-auto mb-6':'text-red-500 mx-auto mb-6'}/>
                            <h2 className={`text-3xl font-bold mb-2 uppercase ${passed?'text-green-600':'text-red-600'}`}>{passed?'Passed':'Failed'}</h2>
                            <p className="text-slate-400 font-bold uppercase text-xs mb-8">Score Achieved</p>
                            <div className="text-6xl font-black text-slate-900 mb-8">{res?.score}<span className="text-2xl text-slate-400">%</span></div>
                            <button onClick={() => setView('dashboard')} className="w-full bg-black text-white py-3 formal-btn text-xs font-bold uppercase tracking-widest">Back to Home</button>
                        </div>
                    </div>
                );
            }

            const AdminNav = () => (
                <nav className="w-64 bg-black text-white p-6 flex flex-col border-r border-slate-800 no-print hidden md:flex">
                    <div className="flex items-center gap-3 mb-10">
                        <div className="w-8 h-8 bg-sks-red rounded flex items-center justify-center font-bold italic text-sm">S</div>
                        <h2 className="font-bold text-lg tracking-tight uppercase">Admin Panel</h2>
                    </div>
                    <div className="space-y-2 flex-1">
                        <button onClick={() => setView('admin_dashboard')} className={`w-full flex items-center gap-3 p-3 rounded-lg font-bold text-xs uppercase tracking-wider text-left ${view==='admin_dashboard'?'bg-sks-red text-white':'text-slate-500 hover:text-white'}`}><Icon name="layout-dashboard" size={16}/> Dashboard</button>
                        <button onClick={() => setView('admin_report')} className={`w-full flex items-center gap-3 p-3 rounded-lg font-bold text-xs uppercase tracking-wider text-left ${view==='admin_report'?'bg-sks-red text-white':'text-slate-500 hover:text-white'}`}><Icon name="users" size={16}/> Trainees</button>
                        <button onClick={() => setView('admin_courses')} className={`w-full flex items-center gap-3 p-3 rounded-lg font-bold text-xs uppercase tracking-wider text-left ${view==='admin_courses'?'bg-sks-red text-white':'text-slate-500 hover:text-white'}`}><Icon name="book-open" size={16}/> Courses</button>
                    </div>
                    <button onClick={logout} className="p-3 font-bold text-xs text-sks-red flex items-center gap-3 hover:bg-slate-900 rounded-lg"><Icon name="log-out" size={16}/> Logout</button>
                </nav>
            );

            const MobileAdminNav = () => (
                <div className="md:hidden bg-black text-white p-4 flex justify-between items-center sticky top-0 z-50">
                    <span className="font-bold uppercase">SKS Admin</span>
                    <div className="flex gap-4">
                        <button onClick={() => setView('admin_dashboard')}><Icon name="layout-dashboard" size={20}/></button>
                        <button onClick={() => setView('admin_report')}><Icon name="users" size={20}/></button>
                        <button onClick={() => setView('admin_courses')}><Icon name="book-open" size={20}/></button>
                        <button onClick={logout} className="text-sks-red"><Icon name="log-out" size={20}/></button>
                    </div>
                </div>
            );

            if (view === 'admin_dashboard') {
                const trainees = allUsers.filter(u => u.role !== 'admin');
                const totalTrainees = trainees.length;
                const companyStats = {};
                trainees.forEach(u => {
                    if (!companyStats[u.company]) companyStats[u.company] = { total: 0, passedAll: 0 };
                    companyStats[u.company].total++;
                    const passedCount = courses.filter(c => u.coursesStatus?.[c.id]?.status === 'Passed').length;
                    if (courses.length > 0 && passedCount === courses.length) {
                        companyStats[u.company].passedAll++;
                    }
                });

                return (
                    <div className="flex flex-col md:flex-row min-h-screen bg-slate-50">
                        <AdminNav /><MobileAdminNav />
                        <main className="flex-1 p-6 md:p-12 overflow-y-auto">
                            <h2 className="text-3xl font-bold text-slate-800 mb-8">System Overview</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                                <div className="bg-white p-8 formal-card border-l-4 border-black">
                                    <p className="text-xs font-bold text-slate-400 uppercase mb-2">Total Trainees</p>
                                    <h3 className="text-5xl font-black text-slate-900">{totalTrainees}</h3>
                                </div>
                                <div className="bg-white p-8 formal-card border-l-4 border-sks-red">
                                    <p className="text-xs font-bold text-slate-400 uppercase mb-2">Active Courses</p>
                                    <h3 className="text-5xl font-black text-sks-red">{courses.length}</h3>
                                </div>
                            </div>
                            <h3 className="text-xl font-bold text-slate-800 mb-6">Company Breakdown</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {Object.entries(companyStats).map(([company, stats]) => (
                                    <div key={company} className="bg-white p-6 formal-card">
                                        <h4 className="font-bold text-lg mb-4">{company}</h4>
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="text-xs text-slate-500 uppercase font-bold">Progress</span>
                                            <span className="text-xs font-bold">{stats.passedAll}/{stats.total} Finished</span>
                                        </div>
                                        <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                            <div className="bg-green-500 h-2" style={{width: `${(stats.passedAll/stats.total)*100}%`}}></div>
                                        </div>
                                        <div className="mt-4 text-xs text-slate-400">
                                            Remaining: <span className="text-sks-red font-bold">{stats.total - stats.passedAll}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </main>
                    </div>
                );
            }

            if (view === 'admin_report') {
                const filteredUsers = allUsers.filter(u => {
                    if (u.role === 'admin') return false;
                    const matchesName = u.name?.toLowerCase().includes(filters.name.toLowerCase());
                    const matchesCompany = u.company?.toLowerCase().includes(filters.company.toLowerCase());
                    return matchesName && matchesCompany;
                });

                return (
                    <div className="flex flex-col md:flex-row min-h-screen bg-slate-50">
                        <AdminNav /><MobileAdminNav />
                        <main className="flex-1 p-6 md:p-12 overflow-y-auto">
                            <div className="flex flex-col md:flex-row justify-between items-end border-b pb-6 mb-8 gap-4">
                                <h2 className="text-3xl font-bold text-slate-800">Trainee Report</h2>
                                <div className="flex gap-3">
                                    <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".csv,.txt" style={{display:'none'}} />
                                    <button onClick={() => fileInputRef.current.click()} className="bg-white text-slate-700 border border-slate-300 px-4 py-2 rounded-lg font-bold text-xs uppercase hover:bg-slate-50 flex items-center gap-2">
                                        <Icon name="upload" size={14}/> Import CSV
                                    </button>
                                    <button onClick={() => exportToCSV(filteredUsers)} className="bg-black text-white px-4 py-2 rounded-lg font-bold text-xs uppercase hover:bg-slate-800 flex items-center gap-2 shadow-md">
                                        <Icon name="download" size={14}/> Export CSV
                                    </button>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4 mb-6">
                                <input placeholder="Filter by Name" className="formal-input p-3 border" value={filters.name} onChange={e => setFilters({...filters, name: e.target.value})}/>
                                <input placeholder="Filter by Company" className="formal-input p-3 border" value={filters.company} onChange={e => setFilters({...filters, company: e.target.value})}/>
                            </div>
                            <div className="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200 overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead className="bg-slate-50 border-b border-slate-200">
                                        <tr>
                                            <th className="p-4 text-xs font-bold uppercase text-slate-500 whitespace-nowrap">Name</th>
                                            <th className="p-4 text-xs font-bold uppercase text-slate-500 whitespace-nowrap">Company</th>
                                            {courses.map(c => (
                                                <th key={c.id} className="p-4 text-xs font-bold uppercase text-slate-500 whitespace-nowrap">{c.titleTh}</th>
                                            ))}
                                            <th className="p-4 text-xs font-bold uppercase text-slate-500 whitespace-nowrap">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredUsers.map(u => (
                                            <tr key={u.id} className="border-b border-slate-100 hover:bg-slate-50">
                                                <td className="p-4 font-bold text-sm whitespace-nowrap">{u.name}</td>
                                                <td className="p-4 text-sm text-slate-600 whitespace-nowrap">{u.company}</td>
                                                {courses.map(c => {
                                                    const s = u.coursesStatus?.[c.id];
                                                    let text = "ยังไม่ได้เรียน";
                                                    let colorClass = "text-slate-400";
                                                    
                                                    if (s?.status === 'Passed') {
                                                        text = `ผ่าน (${s.date})`;
                                                        colorClass = "text-green-600 font-bold";
                                                    } else if (s?.status === 'Failed') {
                                                        text = "ไม่ผ่าน";
                                                        colorClass = "text-red-600 font-bold";
                                                    }
                                                    
                                                    return (
                                                        <td key={c.id} className={`p-4 text-xs whitespace-nowrap ${colorClass}`}>
                                                            {text}
                                                        </td>
                                                    );
                                                })}
                                                <td className="p-4">
                                                    <button onClick={() => { if(confirm('Delete user?')) db.collection('users').doc(u.id).delete(); }} className="text-red-500 hover:text-red-700"><Icon name="trash-2" size={16}/></button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </main>
                    </div>
                );
            }

            if (view === 'admin_courses') {
                return (
                    <div className="flex flex-col md:flex-row min-h-screen bg-slate-50">
                         <AdminNav /><MobileAdminNav />
                        <main className="flex-1 p-6 md:p-12 overflow-y-auto">
                            <h2 className="text-3xl font-bold text-slate-800 mb-8">Course Management</h2>
                            
                            <div className="bg-white p-6 formal-card mb-8 border border-slate-200">
                                <h3 className="font-bold text-lg mb-4">{editingCourse ? 'Edit Course' : 'Create New Course'}</h3>
                                <form onSubmit={handleSaveCourse} className="space-y-4">
                                    <input name="title" defaultValue={editingCourse?.titleTh} placeholder="Course Title" required className="formal-input w-full p-3 border bg-slate-50 outline-none focus:border-black"/>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <input name="videoId" defaultValue={editingCourse?.videoId} placeholder="YouTube Video ID (e.g. dQw4w9WgXcQ)" required className="formal-input w-full p-3 border bg-slate-50 outline-none focus:border-black"/>
                                        <input name="imageUrl" defaultValue={editingCourse?.imageUrl} placeholder="Cover Image URL (Optional)" className="formal-input w-full p-3 border bg-slate-50 outline-none focus:border-black"/>
                                        <input name="timeLimit" type="number" defaultValue={editingCourse?.timeLimit || 0} placeholder="Time Limit (Minutes) - 0 = No Limit" className="formal-input w-full p-3 border bg-slate-50 outline-none focus:border-black"/>
                                    </div>
                                    
                                    <div className="border-t pt-4 mt-4">
                                        <h4 className="font-bold text-sm mb-4">Questions ({editingCourse?.questions?.length || 0})</h4>
                                        <div className="bg-slate-50 p-4 rounded-lg space-y-3 mb-4 border border-slate-200">
                                            <input value={tempQ.q} onChange={e => setTempQ({...tempQ, q: e.target.value})} placeholder="Question Text" className="formal-input w-full p-3 border"/>
                                            <div className="grid grid-cols-2 gap-2">
                                                {tempQ.options.map((opt, i) => (
                                                    <input key={i} value={opt} onChange={e => {
                                                        const newOpts = [...tempQ.options];
                                                        newOpts[i] = e.target.value;
                                                        setTempQ({...tempQ, options: newOpts});
                                                    }} placeholder={`Option ${i+1}`} className="formal-input w-full p-3 border"/>
                                                ))}
                                            </div>
                                            <select value={tempQ.a} onChange={e => setTempQ({...tempQ, a: parseInt(e.target.value)})} className="formal-input w-full p-3 border">
                                                {tempQ.options.map((_, i) => <option key={i} value={i}>Correct Answer: Option {i+1}</option>)}
                                            </select>
                                            <button type="button" onClick={handleAddQuestion} className="formal-btn bg-slate-800 text-white w-full py-2 text-xs font-bold uppercase">Add Question</button>
                                        </div>

                                        <div className="space-y-2 max-h-40 overflow-y-auto">
                                            {editingCourse?.questions?.map((q, i) => (
                                                <div key={i} className="flex justify-between items-center p-3 bg-white border rounded text-sm">
                                                    <span className="truncate w-3/4">{i+1}. {q.q}</span>
                                                    <button type="button" onClick={() => handleRemoveQuestion(i)} className="text-red-500"><Icon name="trash-2" size={14}/></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex gap-2 border-t pt-4">
                                        <button type="submit" className="formal-btn bg-black text-white px-6 py-2 font-bold text-xs uppercase">Save Course</button>
                                        {editingCourse && <button onClick={() => { setEditingCourse(null); setTempQ({q:'', options:['','','',''], a:0}); }} type="button" className="formal-btn bg-slate-200 text-slate-600 px-6 py-2 font-bold text-xs uppercase">Cancel</button>}
                                    </div>
                                </form>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {courses.map(c => (
                                    <div key={c.id} className="bg-white p-6 formal-card flex justify-between items-center group">
                                        <div className="flex gap-4 items-center">
                                            <div className="w-16 h-16 bg-slate-100 rounded-lg overflow-hidden flex-shrink-0">
                                                {c.imageUrl ? <img src={c.imageUrl} className="w-full h-full object-cover"/> : <div className="w-full h-full flex items-center justify-center text-slate-300"><Icon name="image" size={20}/></div>}
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-md">{c.titleTh}</h4>
                                                <p className="text-xs text-slate-400">Time: {c.timeLimit ? c.timeLimit + 'm' : 'Unlimited'} | Q: {c.questions?.length}</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button onClick={() => setEditingCourse(c)} className="p-2 bg-slate-100 rounded hover:bg-slate-200"><Icon name="edit" size={16}/></button>
                                            <button onClick={() => { if(confirm('Delete course?')) db.collection('courses').doc(c.id).delete(); }} className="p-2 bg-red-50 text-red-500 rounded hover:bg-red-100"><Icon name="trash-2" size={16}/></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </main>
                    </div>
                );
            }

            if (view === 'certificate') return (
                // แก้ไข: ลบ class no-print ออกจากตรงนี้ เพื่อให้เนื้อหาแสดงตอนสั่ง print
                <div className="min-h-screen bg-slate-200 flex flex-col items-center p-0 md:p-12 overflow-y-auto">
                    <div className="cert-wrapper print-container">
                        <img 
                            src="https://github.com/chaiyakitpromsri-debug/web-assets/blob/main/logo/certificate_upload.png?raw=true" 
                            className="cert-template-img" 
                            alt="Certificate Template"
                        />
                        
                        <div className="cert-data-text pos-name">
                            {user?.name}
                        </div>
                        
                        <div className="cert-data-text pos-company">
                            {user?.company}
                        </div>
                        
                        <div className="cert-data-text pos-course">
                            {activeCourse?.titleTh}
                        </div>
                        
                        <div className="cert-data-text pos-date">
                            {user?.coursesStatus[activeCourse?.id]?.date}
                        </div>
                    </div>
                    
                    <div className="mt-8 flex gap-4 no-print">
                        <button onClick={() => window.print()} className="formal-btn bg-black text-white px-8 py-3 font-bold text-xs uppercase shadow-lg flex items-center gap-2"><Icon name="printer" size={16}/> Print</button>
                        <button onClick={() => setView('dashboard')} className="formal-btn bg-white text-slate-500 px-8 py-3 font-bold text-xs uppercase border">Close</button>
                    </div>
                </div>
            );

            return null;
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
